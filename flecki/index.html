<script>
'use strict';
/* =========================================================
   Fleckis Herbstabenteuer – ein Tablet-Spiel
   Idee: Lauris Tochter (5) · Umsetzung: HTML5 Canvas
   ========================================================= */
const W = 1200, H = 900;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, S = 1, OX = 0, OY = 0, VW = 0, VH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  S = Math.min(VW / W, VH / H); OX = (VW - W * S) / 2; OY = (VH - H * S) / 2;
}
addEventListener('resize', resize); resize();

const FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy || 1;
  const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l, 0, 1);
  return dist(p.x, p.y, a.x + t * dx, a.y + t * dy);
}
let TIME = 0, idle = 0;

/* ---------------- Audio (alles synthetisch, offline) ---------------- */
let AC = null, MASTER = null, NOISE = null;
function audioInit() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.8; MASTER.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function env(g, t0, a, d, vol) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
function tone(f1, f2, dur, type = 'sine', vol = 0.2, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  env(g, t0, Math.min(0.02, dur / 4), dur, vol); o.connect(g); g.connect(MASTER); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBuf() {
  if (NOISE) return NOISE;
  const b = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return NOISE = b;
}
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0, q = 1) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = noiseBuf();
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); env(g, t0, 0.01, dur, vol);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t0); s.stop(t0 + dur + 0.05);
}
function meow(p = 1, delay = 0, vol = 0.3) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 3;
  o.frequency.setValueAtTime(480 * p, t0); o.frequency.linearRampToValueAtTime(720 * p, t0 + .15); o.frequency.linearRampToValueAtTime(520 * p, t0 + .5);
  f.frequency.setValueAtTime(900 * p, t0); f.frequency.linearRampToValueAtTime(1900 * p, t0 + .15); f.frequency.linearRampToValueAtTime(1000 * p, t0 + .5);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .05); g.gain.setValueAtTime(vol, t0 + .3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + .55);
  o.connect(f); f.connect(g); g.connect(MASTER); o.start(t0); o.stop(t0 + .6);
}
const SFX = {
  meow: () => meow(1 + rnd(-.08, .08)),
  tiny: () => { meow(1.6, 0, .2); meow(1.85, .22, .2); meow(1.5, .45, .2); },
  hop: () => tone(320, 640, .12, 'sine', .12),
  land: () => tone(180, 110, .08, 'sine', .12),
  splat: () => { noise(.35, .55, 800); tone(160, 50, .3, 'sine', .35); },
  pop: () => tone(500, 1300, .09, 'sine', .18),
  klack: () => { noise(.06, .6, 2500, 'bandpass', 0, 2); tone(700, 300, .06, 'square', .08); },
  tick: () => tone(1500, 1300, .03, 'square', .04),
  jingle: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f * 1.01, .22, 'triangle', .14, i * .09)),
  keys: () => { for (let i = 0; i < 4; i++) tone(rnd(2200, 3400), rnd(2000, 3000), .07, 'triangle', .05, i * .06); },
  boing: () => { tone(220, 480, .14, 'sine', .2); tone(480, 220, .18, 'sine', .18, .14); },
  scratch: () => { for (let i = 0; i < 3; i++) noise(.09, .35, 3000, 'bandpass', i * .11, 1.5); },
  whoosh: () => noise(.45, .25, 700, 'bandpass', 0, .8),
  hmm: () => { tone(200, 240, .25, 'triangle', .12); tone(240, 190, .3, 'triangle', .12, .25); },
  oh: () => { tone(300, 500, .15, 'triangle', .15); tone(500, 350, .25, 'triangle', .15, .15); },
  woof: () => { tone(260, 180, .12, 'sawtooth', .06); tone(260, 170, .14, 'sawtooth', .06, .2); },
  door: () => { tone(120, 90, .4, 'sawtooth', .04); noise(.3, .1, 400); },
  star: () => [1047, 1319, 1568].forEach((f, i) => tone(f, f, .15, 'sine', .1, i * .07)),
  fanfare: () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, f, .25, 'triangle', .15, i * .15)),
  fall: () => tone(700, 200, .5, 'sine', .15),
  rustle: () => noise(.5, .35, 1500, 'highpass'),
  tweet: () => { tone(2400, 3200, .06, 'sine', .06); tone(2600, 3400, .06, 'sine', .06, .09); },
};

/* ---------------- Zeichen-Helfer ---------------- */
const OUT = '#3a2e2a';
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI * 2); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); }
function fs(c) { ctx.fillStyle = c; ctx.fill(); }
function st(c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
function starPath(x, y, R, r, n = 5) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rad = i % 2 ? r : R; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x - s * .9, y - s * .25, x - s * .35, y - s * .95, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .35, y - s * .95, x + s * .9, y - s * .25, x, y + s * .35); ctx.closePath();
}
function text(t, x, y, size, col = '#fff', stroke = null, sw = 8, align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(t, x, y); }
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}

/* ---------------- Farben / Häuser ---------------- */
const LEAFC = ['#E8742C', '#F2A03D', '#D9502E', '#F5C04A', '#C0392B'];
const PAL_FLECKI = { w: '#FFFBF4', b: '#2A2426', eye: '#7CC456', ear: '#F6A5B5' };
const PAL_TABBY = { w: '#F7B565', b: '#D47A2A', eye: '#5FA8D8', ear: '#F6A5B5' };
const GOLD = '#F4C542', GOLDD = '#A8790B';
const HOUSES = {
  home: { col: '#8B5A33', roof: '#C0563A', wall: '#FFF1DC', inner: '#F6E3C2', sym: 'paw' },
  0: { col: '#E0533A', roof: '#8C4A2F', wall: '#F9E4C8', inner: '#F7D9C8', sym: 'pumpkin', animal: 'cat' },
  1: { col: '#3F86D6', roof: '#5E4B7D', wall: '#E9EEF4', inner: '#DCE6F2', sym: 'star', animal: 'dog' },
  2: { col: '#5BA03A', roof: '#7A5230', wall: '#F3EBD2', inner: '#E2ECD0', sym: 'leaf', animal: 'kittens' },
};

/* ---------------- Spielstand ---------------- */
let G;
function newGame() { G = { soot: 0, pumpkins: 0, bag: [], returned: [], traced: { out: [0, 0, 0], back: [0, 0, 0] } }; }
newGame();
const SAVEKEY = 'flecki-spielstand-1';
function saveGame(idx) { try { localStorage.setItem(SAVEKEY, JSON.stringify({ idx, G })); } catch (e) {} }
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVEKEY)); } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(SAVEKEY); } catch (e) {} }

/* ---------------- Timer, Partikel, Laub ---------------- */
let TIMERS = [];
function after(t, fn) { TIMERS.push({ t, fn }); }
function updTimers(dt) {
  const due = [];
  for (const tm of TIMERS) { tm.t -= dt; if (tm.t <= 0) due.push(tm); }
  if (due.length) { TIMERS = TIMERS.filter(t => t.t > 0); due.forEach(t => t.fn()); }
}
let PARTS = [];
function burst(x, y, n, cols, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(.3, 1) * (o.sp || 250);
    PARTS.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 120), g: o.g != null ? o.g : 600, life: 0, max: rnd(.6, 1) * (o.life || 1),
      r: rnd(o.r0 || 5, o.r1 || 11), col: cols[i % cols.length], type: o.type || 'dot', rot: rnd(0, 6), vr: rnd(-6, 6) });
  }
}
function updParts(dt) {
  for (const p of PARTS) {
    p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.type !== 'dot' && p.type !== 'star') p.vx *= 1 - 1.5 * dt;
  }
  PARTS = PARTS.filter(p => p.life < p.max);
}
function drawParts() {
  for (const p of PARTS) {
    const k = 1 - p.life / p.max;
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, k * 1.5)); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.type === 'dot') { circ(0, 0, p.r); fs(p.col); }
    else if (p.type === 'leaf') { ell(0, 0, p.r * 1.4, p.r * .7); fs(p.col); }
    else if (p.type === 'star') { starPath(0, 0, p.r * 1.6, p.r * .7); fs(p.col); }
    else if (p.type === 'heart') { ctx.rotate(-p.rot); heartPath(0, 0, p.r * 2.2); fs(p.col); }
    else if (p.type === 'smoke') { ctx.globalAlpha *= .7; circ(0, 0, p.r * (1 + (1 - k) * 2)); fs(p.col); }
    else if (p.type === 'bubble') { circ(0, 0, p.r); st('rgba(255,255,255,.95)', 3); circ(-p.r * .3, -p.r * .3, p.r * .25); fs('#fff'); }
    ctx.restore();
  }
}
const hearts = (x, y, n = 6) => burst(x, y, n, ['#FF6B8B', '#FF9EB3', '#FF4F7B'], { type: 'heart', sp: 160, up: 160, g: -40, r0: 8, r1: 13, life: 1.4 });
const stars = (x, y, n = 12) => burst(x, y, n, ['#FFD54A', '#FFF3B0', '#FFFFFF'], { type: 'star', sp: 320, up: 80, g: 300, r0: 6, r1: 11 });

const FALL = [];
for (let i = 0; i < 14; i++) FALL.push({ x: rnd(0, W), y: rnd(-100, H), vy: rnd(30, 60), ph: rnd(0, 6), r: rnd(7, 12), col: LEAFC[i % 5], rot: rnd(0, 6) });
function updLeaves(dt) {
  for (const l of FALL) { l.y += l.vy * dt; l.x += Math.sin(TIME * 1.2 + l.ph) * 25 * dt; l.rot += dt * 1.5; if (l.y > H + 30) { l.y = -30; l.x = rnd(-50, W + 50); } }
}
function drawLeaves(alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  for (const l of FALL) { ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ell(0, 0, l.r * 1.4, l.r * .7); fs(l.col); ctx.restore(); }
  ctx.restore();
}
const STARS = []; for (let i = 0; i < 70; i++) STARS.push({ x: rnd(-300, W + 300), y: rnd(-300, 520), r: rnd(1.2, 3), ph: rnd(0, 6) });
const GLEAVES = []; for (let i = 0; i < 40; i++) GLEAVES.push({ x: rnd(-300, W + 300), y: rnd(0, 140), c: LEAFC[i % 5], r: rnd(0, 6) });

/* ---------------- Flecki (und andere Katzen) ---------------- */
function makeCat(x, y) { return { x, y, face: 1, pose: 'stand', s: 1, anim: null, carry: null, hidden: false, alpha: 1, walkPh: 0, squash: 0, clipY: null, rot: 0, blinkT: 0, blinkCd: 2, pal: null, soot: null }; }
function catArc(c, tx, ty, h, dur, cb) {
  if (Math.abs(tx - c.x) > 2) c.face = tx > c.x ? 1 : -1;
  c.anim = { type: 'arc', x0: c.x, y0: c.y, tx, ty, h, dur, t: 0, cb }; SFX.hop();
}
function catWalk(c, tx, speed, cb) {
  if (Math.abs(tx - c.x) > 2) c.face = tx > c.x ? 1 : -1;
  c.anim = { type: 'walk', x0: c.x, tx, dur: Math.max(.05, Math.abs(tx - c.x) / speed), t: 0, cb };
}
function catUpdate(c, dt) {
  c.blinkCd -= dt; c.blinkT -= dt; if (c.blinkCd < 0) { c.blinkT = .15; c.blinkCd = rnd(2, 5); }
  c.squash = Math.max(0, c.squash - dt * 4);
  const a = c.anim; if (!a) return;
  a.t += dt; const k = Math.min(1, a.t / a.dur);
  if (a.type === 'arc') { c.x = lerp(a.x0, a.tx, k); c.y = lerp(a.y0, a.ty, k) - Math.sin(Math.PI * k) * a.h; c.pose = 'jump'; }
  else { c.x = lerp(a.x0, a.tx, k); c.walkPh += dt * 11; c.pose = 'walk'; }
  if (k >= 1) { c.anim = null; c.pose = 'stand'; if (a.type === 'arc') { c.squash = 1; SFX.land(); } if (a.cb) a.cb(); }
}
const SOOT = [[-20, -30, 9], [10, -44, 8], [-5, -20, 7], [30, -28, 7], [40, -88, 7], [26, -62, 6], [54, -74, 5], [0, -52, 10], [-30, -40, 6], [20, -15, 6], [48, -96, 5], [12, -82, 6], [-14, -46, 8], [36, -40, 6]];
function eye(x, y, closed, pal) {
  if (closed) { ctx.beginPath(); ctx.arc(x, y - 3, 7, .15 * Math.PI, .85 * Math.PI); st(OUT, 3); return; }
  ell(x, y, 8, 10); fs(pal.eye); ell(x, y + 1, 5.5, 8); fs('#1d1a1a');
  circ(x + 2.5, y - 4, 3); fs('#fff'); circ(x - 2, y + 3.5, 1.5); fs('#fff');
}
function catHead(pal, blink) {
  ctx.beginPath(); ctx.moveTo(12, -86); ctx.lineTo(14, -124); ctx.lineTo(38, -100); ctx.closePath(); fs(pal.b); st(OUT, 4);
  ctx.beginPath(); ctx.moveTo(40, -100); ctx.lineTo(62, -124); ctx.lineTo(64, -84); ctx.closePath(); fs(pal.w); st(OUT, 4);
  ctx.beginPath(); ctx.moveTo(46, -100); ctx.lineTo(60, -116); ctx.lineTo(60, -92); ctx.closePath(); fs(pal.ear);
  circ(36, -72, 33); fs(pal.w);
  ctx.save(); circ(36, -72, 33); ctx.clip(); ell(21, -81, 17, 15); fs(pal.b); ctx.restore();
  circ(36, -72, 33); st(OUT, 4);
  eye(24, -72, blink, pal); eye(48, -72, blink, pal);
  circ(14, -58, 6); fs('rgba(246,130,150,.45)'); circ(58, -58, 6); fs('rgba(246,130,150,.45)');
  ctx.beginPath(); ctx.moveTo(32, -61); ctx.lineTo(40, -61); ctx.lineTo(36, -56); ctx.closePath(); fs('#F28AA0');
  ctx.beginPath(); ctx.moveTo(36, -56); ctx.quadraticCurveTo(33, -50, 29, -52); ctx.moveTo(36, -56); ctx.quadraticCurveTo(39, -50, 43, -52); st(OUT, 2.5);
  ctx.beginPath(); ctx.moveTo(10, -60); ctx.lineTo(-8, -64); ctx.moveTo(10, -55); ctx.lineTo(-8, -53); ctx.moveTo(62, -60); ctx.lineTo(80, -64); ctx.moveTo(62, -55); ctx.lineTo(80, -53); st('rgba(90,80,75,.55)', 2);
}
function catBody(pal, pose, ph, soot, carry, blink) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (pose === 'sleep') { catSleep(pal, soot); return; }
  const jump = pose === 'jump', walk = pose === 'walk';
  ctx.save(); ctx.translate(-36, -40); ctx.rotate(-.25 + Math.sin(TIME * 2.4) * .22 + (jump ? .5 : 0));
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-34, -6, -30, -52); st(OUT, 18); st(pal.w, 11);
  ctx.beginPath(); ctx.moveTo(-33, -32); ctx.quadraticCurveTo(-32, -44, -30, -52); st(pal.b, 11);
  ctx.restore();
  const L = [[-26, 0], [-12, 1], [16, 0], [30, 1]];
  for (let i = 0; i < 4; i++) {
    let dx = 0, dy = 0;
    if (walk) { const s = Math.sin(ph + (L[i][1] ? Math.PI : 0)); dx = s * 7; dy = -Math.max(0, s) * 5; }
    if (jump) { dx = i < 2 ? -10 : 10; dy = -4; }
    ell(L[i][0] + dx, -9 + dy, 9, 12); fs(pal.w); st(OUT, 3.5);
  }
  ell(0, -36, 43, 27); fs(pal.w);
  ctx.save(); ell(0, -36, 43, 27); ctx.clip(); ell(-16, -57, 24, 15); fs(pal.b); ctx.restore();
  ell(0, -36, 43, 27); st(OUT, 4);
  ctx.save(); ctx.translate(0, walk ? Math.sin(ph * 2) * 1.5 : 0); catHead(pal, blink); ctx.restore();
  if (soot > 0) { const n = Math.ceil(soot * SOOT.length); ctx.fillStyle = 'rgba(45,45,50,.5)'; for (let i = 0; i < n; i++) { circ(SOOT[i][0], SOOT[i][1], SOOT[i][2]); ctx.fill(); } }
  if (carry != null) { const hd = HOUSES[carry]; ctx.beginPath(); ctx.moveTo(40, -50); ctx.quadraticCurveTo(30, -30, 40, -18); st(hd.col, 6); drawKey(46, -40, hd.col, 1.25, .55); }
}
function catSleep(pal, soot) {
  ctx.save(); ctx.scale(1, 1 + .03 * Math.sin(TIME * 2.2));
  ell(0, -28, 48, 28); fs(pal.w);
  ctx.save(); ell(0, -28, 48, 28); ctx.clip(); ell(-14, -46, 24, 14); fs(pal.b); ctx.restore();
  ell(0, -28, 48, 28); st(OUT, 4);
  ctx.beginPath(); ctx.moveTo(-44, -16); ctx.quadraticCurveTo(-30, 10, 26, 2); st(OUT, 16); st(pal.w, 10);
  ctx.beginPath(); ctx.moveTo(10, 4); ctx.quadraticCurveTo(20, 3, 26, 2); st(pal.b, 10);
  ctx.beginPath(); ctx.moveTo(14, -44); ctx.lineTo(16, -76); ctx.lineTo(34, -58); ctx.closePath(); fs(pal.b); st(OUT, 4);
  ctx.beginPath(); ctx.moveTo(38, -58); ctx.lineTo(56, -76); ctx.lineTo(58, -44); ctx.closePath(); fs(pal.w); st(OUT, 4);
  circ(34, -30, 28); fs(pal.w);
  ctx.save(); circ(34, -30, 28); ctx.clip(); ell(21, -38, 15, 13); fs(pal.b); ctx.restore();

}

    ctx.beginPath(); ctx.moveTo(pts[from].x, pts[from].y); for (let i = from + 1; i <= to; i++) ctx.lineTo(pts[i].x, pts[i].y); st(c, w); ctx.restore();
  }
  function tryTrace(p) {
    if (done) return;
    let best = -1, bd = 80;
    for (let j = prog; j <= Math.min(N - 1, prog + 12); j++) { const d = dist(p.x, p.y, path[j].x, path[j].y); if (d < bd) { bd = d; best = j; } }
    if (best > prog) { if (Math.floor(best / 6) > Math.floor(prog / 6)) SFX.tick(); prog = best; }
    if (prog >= N - 2) {
      done = true; prog = N - 1; G.traced[back ? 'back' : 'out'][seg] = 1; SFX.jingle();
      const d = path[N - 1]; stars(d.x, d.y - 40, 18); if (back) hearts(d.x, d.y - 60, 6);
      after(1.8, () => next());
    }
  }
  return {
    showBag: !back,
    init() { SFX.pop(); },
    dbg() { return { path, prog, done }; },
    draw() {
      ctx.fillStyle = '#D9BE8C'; ctx.fillRect(-700, -700, W + 1400, H + 1400);
      rr(40, 40, 1120, 820, 30); fs('#F6E7C8'); st('#B88E52', 7);
      rr(58, 58, 1084, 784, 22); st('rgba(184,142,82,.4)', 3);
      [[320, 760], [640, 760], [900, 220], [620, 180], [300, 250], [1080, 640]].forEach(([x, y], i) => {
        if (i % 2) { rr(x - 4, y, 8, 22, 2); fs('#8A5A3C'); circ(x, y - 8, 24); fs(LEAFC[i]); } else pumpkin(x, y + 20, 18, 0, false);
      });
      ctx.save(); ctx.translate(1080, 150); for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); poly([0, -50, 10, 0, -10, 0]); fs(i === 3 ? '#E0533A' : '#8A6A44'); } circ(0, 0, 8); fs('#F6E7C8'); st(OUT, 3); ctx.restore();
      for (let i = 0; i < 3; i++) {
        if (G.traced.out[i]) lineAlong(SEGP[i], 0, 60, '#E0703A', 10, [20, 14]);
        if (G.traced.back[i]) lineAlong(SEGP[i], 0, 60, '#7F77DD', 10, [2, 20]);
      }
      for (let i = prog; i < N; i += 3) { circ(path[i].x, path[i].y, 6); fs('#B08A5A'); }
      if (prog > 0) lineAlong(path, 0, prog, col, 13, back ? [2, 20] : null);
      PL.forEach(pl => {
        miniHouse(pl.x, pl.y, pl.h, pl.h === 'home' ? 1.25 : 1.1);
        const hid = pl.h;
        if (hid !== 'home') {
          if (G.returned.includes(hid)) { heartPath(pl.x + 58, pl.y - 70, 40); fs('#FF5C80'); st('#fff', 3); }
          else if (G.bag.includes(hid) || (!back && hid === destH && done)) { circ(pl.x + 58, pl.y - 70, 24); fs('#fff'); st(OUT, 3); drawKey(pl.x + 48, pl.y - 70, HOUSES[hid].col, 0, .55); }
        } else drawSym('paw', pl.x, pl.y + 62, 26);
      });
      const cp = path[prog];
      if (!done) { pulse(cp.x, cp.y, 52); const tgt = path[N - 1]; pulse(tgt.x, tgt.y, 70); }
      miniCat(cp.x, cp.y + 4, .7);
      if (!done && idle > 1.4) { const k = (TIME * .7) % 1, j = Math.min(N - 1, prog + Math.floor(k * 30)); drawHand(path[j].x + 6, path[j].y + 14); }
      if (back) { ctx.fillStyle = 'rgba(30,40,100,.14)'; ctx.fillRect(-700, -700, W + 1400, H + 1400); circ(140, 140, 40); fs('#FFF6D6'); circ(158, 128, 34); fs('#ECE0C8'); }
    },
    down(p) { tryTrace(p); }, move(p) { tryTrace(p); },
  };
};

/* ---------- Abend: Flecki denkt an die Schlüssel ---------- */
SCENES.evening = () => {
  let k = 0, step = 'sunset', bub = 0;
  const cat = makeCat(560, 612); cat.s = 1.5;
  return {
    showBag: false,
    update(dt) {
      catUpdate(cat, dt); k = Math.min(1, k + dt / 3);
      if (k >= 1 && step === 'sunset') { step = 'think'; meow(.9); after(1.6, () => { step = 'ready'; setHint({ type: 'tap', x: cat.x + 30, y: cat.y - 110, r: 110 }); }); }
      if (step !== 'sunset') bub = Math.min(1, bub + dt * 2);
    },
    draw() {
      sky(false); ctx.save(); ctx.globalAlpha = k; sky(true); ctx.restore();
      hills(k > .5);
      for (let i = 0; i < 6; i++) { const x = i * 230 - 60; rr(x, 640, 170, 300, 4); fs(['#B5654A', '#9C5A3C', '#A86A4A'][i % 3]); poly([x - 16, 644, x + 85, 560, x + 186, 644]); fs('#7A3E2A'); rr(x + 30, 690, 40, 40, 4); fs('#F6D9A6'); rr(x + 100, 690, 40, 40, 4); fs('#F6D9A6'); }
      poly([200, 940, 560, 612, 920, 940]); fs('#8C4A2F'); st(OUT, 5);
      rr(760, 630, 54, 120, 4); fs('#A0705A'); st(OUT, 4);
      ctx.fillStyle = `rgba(20,20,70,${k * .45})`; ctx.fillRect(-700, -700, W + 1400, H + 1400);
      ctx.save(); ctx.globalAlpha = k; for (let i = 0; i < 6; i++) { const x = i * 230 - 60; rr(x + 30, 690, 40, 40, 4); fs('#FFD27A'); rr(x + 100, 690, 40, 40, 4); fs('#FFD27A'); } ctx.restore();
      drawCat(cat); drawBag(690, 590, .9);
      if (bub > 0) {
        ctx.save(); ctx.globalAlpha = bub;
        circ(680, 450, 14); fs('#fff'); st(OUT, 3); circ(720, 395, 22); fs('#fff'); st(OUT, 3);
        ell(870, 240, 260, 130); fs('#fff'); st(OUT, 4);
        [0, 1, 2].forEach(i => { const x = 730 + i * 140; miniHouse(x, 270, i, .9); circ(x + 46, 196, 22); fs('#FFF3D6'); st(OUT, 3); text('?', x + 46, 198, 30, '#E0533A'); });
        ctx.restore();
      }
    },
    down(p) {
      if (step === 'ready' && dist(p.x, p.y, cat.x + 30, cat.y - 110) < 200) { step = 'go'; HINT = null; SFX.meow(); cat.squash = 1; hearts(cat.x + 40, cat.y - 200, 6); after(1.2, () => next()); }
    },
  };
};

/* ---------- Ende ---------- */
SCENES.end = () => {
  const cat = makeCat(600, 660); cat.s = 2.1; cat.pose = 'sleep'; cat.soot = 0;
  const b = { x: 600, y: 820 };
  return {
    showBag: false, hud: false,
    init() { clearSave(); SFX.fanfare(); after(.5, () => stars(600, 300, 30)); },
    update(dt) { catUpdate(cat, dt); cat.pose = 'sleep'; },
    draw() {
      sky(true); hills(true);
      ell(600, 670, 280, 64); fs('#C0504D'); st(OUT, 5); ell(600, 650, 250, 40); fs('#E57373');
      drawCat(cat); zzz(700, 520);
      text('Gute Nacht, Flecki!', 540, 110, 66, '#FFF6E8', '#3A2E5A', 14);
      if (G.pumpkins > 0) { drawSym('pumpkin', 470, 220, 40); text('× ' + G.pumpkins, 520, 225, 54, '#FFF6E8', '#3A2E5A', 10, 'left'); }
      for (let i = 0; i < 3; i++) { heartPath(700 + i * 70, 222, 54); fs('#FF5C80'); st('#fff', 3); }
      circ(b.x, b.y, 64); fs('#5BBF4A'); st('#2F6E25', 7);
      ctx.beginPath(); ctx.arc(b.x, b.y, 30, -Math.PI * .1, Math.PI * 1.5); st('#fff', 10); poly([b.x - 6, b.y - 44, b.x + 14, b.y - 30, b.x - 6, b.y - 16]); fs('#fff');
    },
    down(p) {
      if (dist(p.x, p.y, b.x, b.y) < 85) { SFX.pop(); newGame(); goto(1); }
      else if (dist(p.x, p.y, cat.x, cat.y - 60) < 200) { meow(1.2, 0, .15); hearts(cat.x, cat.y - 120, 4); }
    },
  };
};

/* =========================================================
   ABLAUF
   ========================================================= */
const FLOW = [
  { s: 'title' },
  { s: 'living', mode: 'escape' },
  { s: 'room', h: 'home', mode: 'take' },
  { s: 'wire', len: 2 },
  { s: 'out', h: 0, mode: 'take' }, { s: 'room', h: 0, mode: 'take' }, { s: 'map', seg: 0, dir: 'out' },
  { s: 'wire', len: 1 },
  { s: 'out', h: 1, mode: 'take' }, { s: 'room', h: 1, mode: 'take' }, { s: 'map', seg: 1, dir: 'out' },
  { s: 'wire', len: 1 },
  { s: 'out', h: 2, mode: 'take' }, { s: 'room', h: 2, mode: 'take' }, { s: 'map', seg: 2, dir: 'out' },
  { s: 'evening' },
  { s: 'out', h: 2, mode: 'give' }, { s: 'room', h: 2, mode: 'give' }, { s: 'map', seg: 2, dir: 'back' },
  { s: 'out', h: 1, mode: 'give' }, { s: 'room', h: 1, mode: 'give' }, { s: 'map', seg: 1, dir: 'back' },
  { s: 'out', h: 0, mode: 'give' }, { s: 'room', h: 0, mode: 'give' }, { s: 'map', seg: 0, dir: 'back' },
  { s: 'out', h: 'home', mode: 'give' }, { s: 'room', h: 'home', mode: 'give' },
  { s: 'living', mode: 'return' },
  { s: 'end' },
];
let scene = null, flowIdx = 0, PAUSE = false;
const fade = { a: 0, dir: 0, cb: null };
function startScene(idx) {
  flushFly(); flowIdx = idx; TIMERS = []; PARTS = []; HINT = null;
  const f = FLOW[idx]; scene = SCENES[f.s](f);
  if (idx >= 1 && f.s !== 'end') saveGame(idx);
  if (scene.init) scene.init();
}
function goto(idx) { if (fade.dir) return; fade.dir = 1; fade.cb = () => { startScene(idx); fade.dir = -1; }; }
function next() { goto(flowIdx + 1); }
function updFade(dt) {
  if (fade.dir === 1) { fade.a += dt * 3; if (fade.a >= 1) { fade.a = 1; const cb = fade.cb; fade.cb = null; cb && cb(); } }
  else if (fade.dir === -1) { fade.a -= dt * 2.5; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
}

/* ---------------- HUD, Pause ---------------- */
function drawHUD() {
  circ(54, 54, 34); fs('rgba(255,255,255,.75)'); st(OUT, 3);
  poly([34, 58, 54, 38, 74, 58]); fs(OUT); rr(40, 56, 28, 18, 2); fs(OUT);
  if (G.pumpkins > 0) { drawSym('pumpkin', 128, 56, 26); text('' + G.pumpkins, 162, 58, 38, '#fff', OUT, 7, 'left'); }
  if (scene.showBag && G.bag.length) drawBag(BAGPOS.x, BAGPOS.y, 1);
}
function drawPause() {
  ctx.fillStyle = 'rgba(20,15,10,.6)'; ctx.fillRect(-700, -700, W + 1400, H + 1400);
  circ(600, 400, 100); fs('#5BBF4A'); st('#fff', 7); poly([570, 355, 570, 445, 645, 400]); fs('#fff');
  circ(600, 650, 56); fs('#F29E38'); st('#fff', 5); poly([570, 656, 600, 626, 630, 656]); fs('#fff'); rr(580, 652, 40, 26, 3); fs('#fff');
  text('Weiterspielen', 600, 540, 34, '#fff'); text('Zum Menü', 600, 740, 26, '#fff');
}
function pauseDown(p) { PAUSE = false; if (dist(p.x, p.y, 600, 650) < 75) goto(0); }

/* ---------------- Eingabe ---------------- */
let PTR = null;
const toV = e => ({ x: (e.clientX - OX) / S, y: (e.clientY - OY) / S });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit(); idle = 0;
  if (fade.dir) return;
  const p = toV(e);
  if (PAUSE) { pauseDown(p); return; }
  if (scene.hud !== false && dist(p.x, p.y, 54, 54) < 46) { PAUSE = true; SFX.pop(); return; }
  if (PTR == null) { PTR = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
  if (scene.down) scene.down(p);
}, { passive: false });
cv.addEventListener('pointermove', e => { if (e.pointerId !== PTR || PAUSE || fade.dir) return; e.preventDefault(); if (scene.move) scene.move(toV(e)); }, { passive: false });
const endPtr = e => { if (e.pointerId !== PTR) return; PTR = null; if (!PAUSE && scene.up) scene.up(toV(e)); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
['touchmove', 'gesturestart', 'contextmenu', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* ---------------- Hauptschleife ---------------- */
let last = performance.now();
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#2b1d14'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  scene.draw();
  if (!scene.ownParts) drawParts();
  drawFly();
  if (scene.hud !== false) drawHUD();
  if (!fade.dir && !PAUSE) drawHint();
  if (PAUSE) drawPause();
  if (fade.a > 0) { ctx.fillStyle = `rgba(30,20,15,${fade.a})`; ctx.fillRect(-2000, -2000, W + 4000, H + 4000); }
  if (VH > VW * 1.1) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = 'rgba(30,20,15,.88)'; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(VW / 2, VH / 2 - 40); ctx.rotate(Math.sin(TIME * 2) * .6 - .6); rr(-50, -75, 100, 150, 14); st('#fff', 6); ctx.restore();
    text('Bitte das Tablet quer halten', VW / 2, VH / 2 + 90, 26, '#fff');
  }
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TIME += dt; idle += dt;
  try {
    if (!PAUSE) { updTimers(dt); if (scene.update) scene.update(dt); updParts(dt); updLeaves(dt); updFly(dt); }
    updFade(dt); render();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
startScene(0);
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__F = { get idx() { return flowIdx; }, get hint() { return HINT; }, get scene() { return scene; }, get G() { return G; }, get fading() { return fade.dir; }, FLOW, goto: i => { startScene(i); } };
</script>
