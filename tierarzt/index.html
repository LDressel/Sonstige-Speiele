<script>
'use strict';
/* =========================================================
   Belles Tierarztpraxis – ein Tablet-Spiel
   Idee: Lauris Tochter (5). Belle ist Tierärztin, die Tiere kommen zu ihr.
   Grafik: SVG im Code gezeichnet. Stimme: fertige MP3s im Ordner ton/
   ========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const ST = $('st');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const FAST = /schnell/.test(location.search);   // nur zum Testen
function el(tag, attrs, parent, html) {
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function clear(g) { while (g.firstChild) g.removeChild(g.firstChild); }

/* ---------------- Ablauf-Steuerung (abbrechbar) ---------------- */
let RUN = 0; const ABORT = { abort: true };
function wait(ms) { const r = RUN; return new Promise((res, rej) => setTimeout(() => r === RUN ? res() : rej(ABORT), FAST ? Math.min(ms, 30) : ms)); }
function tween(ms, fn, ease = easeIO) {
  const r = RUN; if (FAST) ms = Math.min(ms, 40);
  return new Promise((res, rej) => {
    const t0 = performance.now();
    function f(now) {
      if (r !== RUN) return rej(ABORT);
      const t = Math.min(1, (now - t0) / ms); fn(ease(t));
      if (t < 1) requestAnimationFrame(f); else res();
    }
    requestAnimationFrame(f);
  });
}
function guard(p) { return p.catch(e => { if (e !== ABORT) console.error(e); }); }

/* ---------------- Audio ---------------- */
const AC = new (window.AudioContext || window.webkitAudioContext)();
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}  // auch bei Stummschalter
const MASTER = AC.createGain(); MASTER.gain.value = 0.9; MASTER.connect(AC.destination);
const VGAIN = AC.createGain(); VGAIN.gain.value = 1.0; VGAIN.connect(MASTER);
const SGAIN = AC.createGain(); SGAIN.gain.value = 0.45; SGAIN.connect(MASTER);
let unlocked = false;
function unlockAudio() {
  if (AC.state !== 'running') AC.resume();
  if (unlocked) return; unlocked = true;
  try { const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0); } catch (e) {}
}
const BUF = {};
function getBuf(id) {
  if (!BUF[id]) BUF[id] = fetch('ton/' + id + '.mp3').then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
    .then(b => new Promise((res, rej) => AC.decodeAudioData(b, res, rej)));
  return BUF[id];
}
fetch('ton/liste.json').then(r => r.json()).then(l => { let i = 0; (function next() { for (let k = 0; k < 6 && i < l.length; k++) getBuf(l[i++]).catch(() => {}); if (i < l.length) setTimeout(next, 60); })(); }).catch(() => {});

const V = { src: null, tok: 0, speaking: false, who: null, last: null, rep: 0 };
function stopVoice() { V.tok++; const s = V.src; V.src = null; V.speaking = false; if (s) try { s.stop(); } catch (e) {} }
function say(id, opt = {}) {
  stopVoice(); const r = RUN, tok = V.tok;
  if (opt.instr) { V.last = id; V.rep = 0; }
  V.who = opt.who || 'erz'; V.speaking = true; idle = 0;
  return new Promise((res, rej) => {
    const done = () => { if (tok === V.tok) { V.speaking = false; V.src = null; } if (r !== RUN) rej(ABORT); else res(); };
    if (FAST) { setTimeout(done, 40); return; }
    getBuf(id).then(buf => {
      if (tok !== V.tok) return res();
      const s = AC.createBufferSource(); s.buffer = buf; s.connect(VGAIN); V.src = s;
      let fin = false; const f = () => { if (fin) return; fin = true; done(); };
      s.onended = f; setTimeout(f, buf.duration * 1000 + 1500);
      s.start();
    }).catch(() => { setTimeout(done, 300); });
  });
}
async function says(ids, opt) { for (const id of ids) await say(id, opt); }

/* Geräusche, synthetisch */
function tone(f, d, type = 'sine', vol = .5, f2 = null, delay = 0) {
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(SGAIN); o.start(t); o.stop(t + d + .05);
}
let NOISE = null;
function noise(d, vol = .3, fq = 800, q = 1, delay = 0, type = 'bandpass') {
  if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const c = NOISE.getChannelData(0); for (let i = 0; i < c.length; i++) c[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; fl.type = type; fl.frequency.value = fq; fl.Q.value = q;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(fl); fl.connect(g); g.connect(SGAIN); s.start(t); s.stop(t + d + .05);
}
const SFX = {
  pop() { tone(520, .09, 'sine', .4, 880); },
  pick() { tone(660, .07, 'triangle', .3, 990); },
  boing() { tone(300, .25, 'sine', .4, 150); tone(310, .25, 'triangle', .15, 160); },
  ding() { tone(1320, .5, 'sine', .25); tone(1980, .4, 'sine', .1); },
  bell() { tone(988, .7, 'sine', .3); tone(784, .9, 'sine', .3, null, .35); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'triangle', .28, null, i * .09)); },
  sparkle() { for (let i = 0; i < 6; i++) tone(rnd(1400, 2600), .15, 'sine', .12, null, i * .05); },
  whoosh() { noise(.35, .25, 1200, .8); },
  heart() { for (let i = 0; i < 4; i++) { tone(70, .12, 'sine', .9, 50, i * .8); tone(62, .12, 'sine', .7, 45, i * .8 + .22); } },
  rattle() { for (let i = 0; i < 4; i++) { tone(70, .12, 'sine', .7, 50, i * .8); noise(.5, .25, 500, 3, i * .8 + .1); } },
  xray() { tone(110, 1.6, 'sawtooth', .06, 140); noise(1.6, .05, 3000, .5); },
  drip() { tone(900, .12, 'sine', .35, 1700); },
  rub() { noise(.12, .12, 2500, .7); },
  gulp() { tone(260, .12, 'sine', .4, 140); tone(240, .12, 'sine', .3, 120, .18); },
  stick() { tone(420, .06, 'square', .08, 300); tone(700, .1, 'sine', .25, null, .03); },
  plop() { tone(200, .12, 'sine', .4, 500); },
  hop() { tone(330, .14, 'sine', .25, 620); },
  cough() { noise(.16, .25, 600, 1.5); noise(.16, .2, 600, 1.5, .22); },
};

/* ---------------- Spielinhalt ---------------- */
const TIERE = {
  hase:    { fur: '#DCC6AA', dark: '#A88B6C', light: '#F8EFE3', inner: '#F5B5C2', eyes: '#3B2A22' },
  hund:    { fur: '#E6B276', dark: '#A8733F', light: '#FCEBD5', inner: '#8E5C33', eyes: '#3B2A22' },
  maus:    { fur: '#C3C4D1', dark: '#8E8FA2', light: '#EEEFF5', inner: '#F6B2C0', eyes: '#2B2B36' },
  baer:    { fur: '#AE8056', dark: '#77532F', light: '#E5C6A3', inner: '#8B623C', eyes: '#2E2017' },
  fuchs:   { fur: '#F08E43', dark: '#B9601F', light: '#FFF5EA', inner: '#5B3A2B', eyes: '#2E2017' },
  schwein: { fur: '#F8BDC5', dark: '#D9848F', light: '#FDE1E5', inner: '#EE9AA6', eyes: '#3A2328' },
};
const TIER_IDS = Object.keys(TIERE);
// Ohr-Position (lokal) für Ohrenspiegel/Tropfen
const OHR = { hase: [-30, -318], hund: [-74, -208], maus: [-62, -265], baer: [-56, -262], fuchs: [-46, -268], schwein: [-52, -258] };
const ZIEL = { pfote: [-62, -32], mund: [0, -168], stirn: [0, -248], brust: [0, -98], hals: [0, -134] };

const GERAETE = {
  lupe:         { buch: 'buch_lupe', ziel: 'pfote' },
  thermo:       { buch: 'buch_thermo', ziel: 'mund' },
  stetho:       { buch: 'buch_stetho', ziel: 'brust', neu: 'neu_stetho' },
  roentgen:     { buch: 'buch_roentgen', ziel: 'brust', neu: 'neu_roentgen' },
  ohrenspiegel: { buch: 'buch_ohrenspiegel', ziel: 'ohr', neu: 'neu_ohrenspiegel' },
};
const GERAET_ORDER = ['lupe', 'thermo', 'stetho', 'roentgen', 'ohrenspiegel'];
// Befund je Gerät: welche Krankheit wird damit erkannt?
const BEFUND = {
  lupe: { splitter: 'befund_lupe_splitter', schramme: 'befund_lupe_schramme', bruch: 'befund_lupe_bruch', _: 'befund_lupe_ok' },
  thermo: { fieber: 'befund_thermo_fieber', _: 'befund_thermo_ok' },
  stetho: { husten: 'befund_stetho_husten', _: 'befund_stetho_ok' },
  roentgen: { bruch: 'befund_roentgen_bruch', _: 'befund_roentgen_ok' },
  ohrenspiegel: { ohren: 'befund_ohr_ohren', _: 'befund_ohr_ok' },
};
const KRANK = {
  splitter: { geraet: 'lupe', schritte: [{ item: 'pinzette', art: 'ziehen', ziel: 'pfote' }, { item: 'pflaster', art: 'drauf', ziel: 'pfote' }] },
  schramme: { geraet: 'lupe', schritte: [{ item: 'tupfer', art: 'reiben', ziel: 'pfote', menge: 750 }, { item: 'salbe', art: 'drauf', ziel: 'pfote' }, { item: 'pflaster', art: 'drauf', ziel: 'pfote' }] },
  fieber:   { geraet: 'thermo', schritte: [{ item: 'fiebersaft', art: 'loeffel', ziel: 'mund' }, { item: 'waschlappen', art: 'drauf', ziel: 'stirn' }] },
  husten:   { geraet: 'stetho', schritte: [{ item: 'hustensaft', art: 'loeffel', ziel: 'mund' }, { item: 'schal', art: 'drauf', ziel: 'hals' }] },
  bruch:    { geraet: 'roentgen', schritte: [{ item: 'gips', art: 'reiben', ziel: 'pfote', menge: 1100 }, { item: 'sticker', art: 'drauf', ziel: 'pfote' }] },
  ohren:    { geraet: 'ohrenspiegel', schritte: [{ item: 'tropfen', art: 'tropfen', ziel: 'ohr', menge: 3 }, { item: 'watte', art: 'drauf', ziel: 'ohr' }] },
};
const KRANK_ORDER = ['splitter', 'schramme', 'fieber', 'husten', 'bruch', 'ohren'];
// Was an welchem Praxistag neu dazukommt
const FREI = [
  null,
  { geraete: ['lupe', 'thermo'], krank: ['splitter', 'schramme', 'fieber'] },
  { geraete: ['stetho'], krank: ['husten'] },
  { geraete: ['roentgen'], krank: ['bruch'] },
  { geraete: ['ohrenspiegel'], krank: ['ohren'] },
];
function frei(day) {
  const g = [], k = [];
  for (let d = 1; d <= Math.min(day, FREI.length - 1); d++) { g.push(...FREI[d].geraete); k.push(...FREI[d].krank); }
  return { geraete: g, krank: k };
}
function neuAmTag(day) { return day < FREI.length && day > 1 ? FREI[day] : null; }
function makeDay(day) {
  const f = frei(day), n = day === 1 ? 3 : day < FREI.length ? 4 : 5, list = [];
  const neu = neuAmTag(day);
  let lastA = null, lastK = null;
  for (let i = 0; i < n; i++) {
    let k;
    if (i === 0 && neu) k = neu.krank[0];
    else if (day === 1) k = ['splitter', 'fieber', 'schramme'][i];
    else { do { k = pick(f.krank); } while (k === lastK && f.krank.length > 1); }
    let a; do { a = pick(TIER_IDS); } while (a === lastA);
    list.push({ a, k }); lastA = a; lastK = k;
  }
  return list;
}

/* ---------------- Spielstand ---------------- */
const SAVEKEY = 'belle-tierarzt-v1';
let SAVE = null;
function newSave() { return { day: 1, pat: 0, list: null, buch: {}, geheilt: 0 }; }
function save() { try { localStorage.setItem(SAVEKEY, JSON.stringify(SAVE)); } catch (e) {} }
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVEKEY)); } catch (e) { return null; } }

/* =========================================================
   GRAFIK
   ========================================================= */
function drawRoom() {
  const g = $('room');
  let s = '';
  // Wand
  s += `<rect x="0" y="0" width="1200" height="900" fill="url(#gWall)"/>`;
  // Tapetenmuster: kleine Pfoten und Herzchen
  for (let y = 40; y < 520; y += 90) for (let x = (y / 90 % 2) * 60 + 20; x < 1200; x += 120) {
    if ((x + y) % 240 < 120) s += `<g transform="translate(${x},${y}) scale(.55)" fill="#B9DED2" opacity=".55">${pawShape()}</g>`;
    else s += `<path transform="translate(${x},${y}) scale(.5)" d="M0 8 C-14 -6 -10 -18 0 -10 C10 -18 14 -6 0 8Z" fill="#F4C4CC" opacity=".5"/>`;
  }
  // Holzverkleidung unten an der Wand
  s += `<rect x="0" y="520" width="1200" height="150" fill="url(#gWain)"/>`;
  for (let x = 30; x < 1200; x += 70) s += `<rect x="${x}" y="540" width="44" height="110" rx="8" fill="#FFF4E3" opacity=".55"/>`;
  s += `<rect x="0" y="512" width="1200" height="16" rx="6" fill="#F1C995"/><rect x="0" y="512" width="1200" height="5" fill="#FFF" opacity=".5"/>`;
  // Boden
  s += `<rect x="0" y="662" width="1200" height="238" fill="url(#gFloor)"/>`;
  for (let y = 662, i = 0; y < 900; y += 40, i++) {
    s += `<line x1="0" y1="${y}" x2="1200" y2="${y}" stroke="#C88A55" stroke-width="2" opacity=".5"/>`;
    for (let x = (i % 2) * 90 + 40; x < 1200; x += 180) s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + 40}" stroke="#C88A55" stroke-width="2" opacity=".4"/>`;
  }
  s += `<rect x="0" y="662" width="1200" height="10" fill="#B9804E" opacity=".35"/>`;
  // Fenster
  s += `<g filter="url(#sh)"><rect x="298" y="118" width="244" height="244" rx="26" fill="#FFFFFF"/></g>
    <g clip-path="url(#clipWin)">
      <rect x="312" y="132" width="216" height="216" fill="url(#gSky)"/>
      <circle cx="480" cy="182" r="26" fill="#FFE27A"/><circle cx="480" cy="182" r="38" fill="#FFE27A" opacity=".3"/>
      <g fill="#FFFFFF" opacity=".95"><ellipse cx="360" cy="178" rx="30" ry="14"/><ellipse cx="385" cy="170" rx="22" ry="15"/></g>
      <ellipse cx="350" cy="380" rx="160" ry="90" fill="#A7DB8A"/><ellipse cx="500" cy="390" rx="140" ry="85" fill="#8FCF74"/>
      <rect x="440" y="250" width="12" height="60" rx="4" fill="#A0703F"/>
      <circle cx="446" cy="240" r="32" fill="#6FBF5C"/><circle cx="430" cy="252" r="22" fill="#7FCB69"/><circle cx="462" cy="250" r="22" fill="#62B04F"/>
      <circle cx="436" cy="232" r="4" fill="#F26D6D"/><circle cx="458" cy="246" r="4" fill="#F26D6D"/>
    </g>
    <rect x="417" y="132" width="8" height="216" fill="#FFFFFF"/><rect x="312" y="236" width="216" height="8" fill="#FFFFFF"/>
    <rect x="290" y="352" width="260" height="18" rx="9" fill="#F7F7F7"/>
    <path d="M286 104 Q310 230 296 372 L262 372 Q272 230 262 104Z" fill="#F7B8C2"/><path d="M554 104 Q530 230 544 372 L578 372 Q568 230 578 104Z" fill="#F7B8C2"/>
    <rect x="250" y="96" width="340" height="12" rx="6" fill="#E9A3AE"/>
    <g transform="translate(330,330)"><path d="M0 22 L44 22 L40 0 L4 0Z" fill="#F29A6B"/><circle cx="12" cy="-6" r="10" fill="#7CC36A"/><circle cx="26" cy="-12" r="12" fill="#6AB559"/><circle cx="34" cy="-2" r="9" fill="#86CC73"/></g>`;

/* ---------- Effekte ---------- */
const PARTS = [];
function burst(x, y, n = 18, colors = ['#FFD84D', '#F57F87', '#8FD0F2', '#B6E39B', '#FFFFFF'], kind = 'star') {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(160, 420);
    const e = kind === 'heart' ? el('path', { d: 'M0 8 C-14 -6 -10 -18 0 -10 C10 -18 14 -6 0 8Z', fill: pick(['#F57F87', '#FF9AA8', '#F2575E']) }, $('fx'))
      : el('path', { d: star(0, 0, rnd(8, 14), rnd(4, 6)), fill: pick(colors) }, $('fx'));
    PARTS.push({ e, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, life: rnd(.8, 1.4), t: 0, r: rnd(0, 360), vr: rnd(-300, 300), g: kind === 'heart' ? -120 : 600 });
  }
}
function floatHearts(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const e = el('path', { d: 'M0 8 C-14 -6 -10 -18 0 -10 C10 -18 14 -6 0 8Z', fill: pick(['#F57F87', '#FF9AA8']) }, $('fx'));
    PARTS.push({ e, x: x + rnd(-60, 60), y: y + rnd(-20, 20), vx: rnd(-20, 20), vy: rnd(-140, -90), life: rnd(1.4, 2.2), t: -i * .15, r: 0, vr: 0, g: 0, sc: rnd(1.2, 2) });
  }
}
function updParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i]; p.t += dt;
    if (p.t < 0) { p.e.setAttribute('opacity', 0); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    const k = p.t / p.life;
    p.e.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.r.toFixed(0)}) scale(${p.sc || 1})`);
    p.e.setAttribute('opacity', Math.max(0, 1 - k * k).toFixed(2));
    if (k >= 1) { p.e.remove(); PARTS.splice(i, 1); }
  }
}

let DRAG = null;

function endDrag(keep) {

  const fx = d.x, fy = d.y, g = d.gh;

function resolveDrop(x, y) {

  if (MODE === 'exam') {

  const st = curStep();

  const d0 = dist(x, y, tx, ty);

let BOOK_VLAST = null;
function closeBook() {

  MODE = BOOK_PREV || 'exam'; V.last = BOOK_VLAST;
  if (MODE === 'diag') MODE = 'exam';  // Karten wurden durchs Buch geschlossen
  if (MODE === 'end' || MODE === 'intro' || MODE === 'arrive') { /* läuft weiter */ }
}

/* =========================================================
   ANIMATION (Blinzeln, Atmen, Schwanz, Hinweise)
   ========================================================= */
function setBelle(x, y, s) { BELLE.x = x; BELLE.y = y; BELLE.s = s; }
let last = performance.now(), TIME = 0, blinkT = 2, pBlinkT = 3, talkT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TIME += dt; idle += dt;
  // Belle
  if (BELLE.g) {
    BELLE.bounce = Math.max(0, BELLE.bounce - dt * 1.6);
    const by = -Math.abs(Math.sin(BELLE.bounce * Math.PI * 2)) * 40 * BELLE.bounce;
    const br = 1 + Math.sin(TIME * 2) * .008;
    BELLE.g.setAttribute('transform', `translate(${BELLE.x},${BELLE.y + by}) scale(${BELLE.s || 1},${(BELLE.s || 1) * br})`);
    BELLE.tail.setAttribute('transform', `rotate(${Math.sin(TIME * 1.6) * 6} 50 -70)`);
    BELLE.head.setAttribute('transform', `rotate(${Math.sin(TIME * .9) * 2} 0 -230)`);
    blinkT -= dt; const bl = blinkT < 0 ? .1 : 1; if (blinkT < -.13) blinkT = rnd(2, 5);
    BELLE.eyes.setAttribute('transform', `translate(0,-307) scale(1,${bl}) translate(0,307)`);
  }
  // Patient
  if (P && P.g.isConnected && $('patWrap').style.display !== 'none') {
    let hj = 0;
    if (P.cough > 0) { P.coughT -= dt * (P.cough > .5 ? 1 : .35); if (P.coughT < 0) { P.coughT = rnd(2.5, 4); coughPuff(); } const c = P.coughT > 2.3 ? Math.sin((P.coughT - 2.3) * 20) * 6 : 0; hj = c; }
    const br = Math.sin(TIME * 2.4) * .012;
    P.body.setAttribute('transform', `translate(0,-10) scale(1,${1 + br}) translate(0,10)`);
    P.head.setAttribute('transform', `translate(0,${hj + Math.sin(TIME * 2.4) * 1.5}) rotate(${P.mood === 'sick' ? -4 + Math.sin(TIME) * 1.5 : Math.sin(TIME * 3) * 4} 0 -150)`);
    P.tail.setAttribute('transform', `rotate(${Math.sin(TIME * (P.mood === 'happy' ? 8 : 1.5)) * (P.mood === 'happy' ? 10 : 3)} 60 -40)`);
    pBlinkT -= dt; const pb = pBlinkT < 0 ? .12 : (P.mood === 'sick' && P.k === 'fieber' && !P.healed ? .6 : 1); if (pBlinkT < -.13) pBlinkT = rnd(2, 4.5);
    P.eyes.setAttribute('transform', `translate(0,-218) scale(1,${pb}) translate(0,218)`);
    if (P.k === 'splitter' || P.k === 'schramme' || P.k === 'bruch') P.armR.setAttribute('transform', P.healed ? '' : `translate(0,${-6 + Math.sin(TIME * 3) * 2})`);
    // Sprechen
    const talking = V.speaking && V.who === 'tier';
    talkT += dt;
    if (talking) { const o = Math.sin(talkT * 22) > 0; P.mO.style.display = o ? '' : 'none'; P.mH.style.display = o || P.mood === 'sick' ? 'none' : ''; P.mS.style.display = o || P.mood !== 'sick' ? 'none' : ''; P.talk = true; }
    else if (P.talk) { P.talk = false; setMood(P.mood); }
  }
  // Klemmbrett pulsiert
  if (CLIP.g) { const k = CLIP.pulse ? 1 + Math.sin(TIME * 6) * .05 : 1; CLIP.g.setAttribute('transform', `translate(${CLIP.x},${CLIP.y}) rotate(${-6 + (CLIP.pulse ? Math.sin(TIME * 6) * 2 : 0)}) scale(${k})`); }
  // Lautsprecher-Wellen
  if (HUD.w1) { const on = V.speaking && V.who !== 'tier'; HUD.w1.setAttribute('opacity', on ? (.5 + .5 * Math.sin(TIME * 12)).toFixed(2) : 1); HUD.w2.setAttribute('opacity', on ? (.5 + .5 * Math.sin(TIME * 12 + 1.5)).toFixed(2) : 1); }
  // Titel-Knopf
  if (TITLE_PULSE && TITLE_PULSE.isConnected) { const k = 1 + Math.sin(TIME * 4) * .05; const tr = TITLE_PULSE.getAttribute('transform').replace(/ scale\([^)]*\)/, ''); TITLE_PULSE.setAttribute('transform', tr + ` scale(${k})`); }
  if (REVEAL) REVEAL.setAttribute('transform', `rotate(${TIME * 20})`);
  // Hinweis im Koffer
  const hint = (MODE === 'treat' && idle > 8 && P && P.stepDone) ? curStep().item : TRAY_HINT;
  $('tray').querySelectorAll('.slot').forEach(s => { const on = s.getAttribute('data-item') === hint; s.querySelector('.slotHi').setAttribute('opacity', on ? (.6 + .4 * Math.sin(TIME * 8)).toFixed(2) : 0); });
  // Automatisch wiederholen
  if ((MODE === 'exam' || MODE === 'treat' || MODE === 'diag' || MODE === 'tropfen') && !V.speaking && idle > 15 && V.last && V.rep < 2) { V.rep++; idle = 0; guard(say(V.last)); }
  updParts(dt);
  requestAnimationFrame(frame);
}
function coughPuff() {

    const e = el('circle', { r: rnd(10, 18), fill: '#FFFFFF', stroke: '#C9D5DE', 'stroke-width': 3 }, $('fx'));
    PARTS.push({ e, x: x + i * 10, y: y + rnd(-6, 6), vx: rnd(60, 120), vy: rnd(-30, 10), life: .9, t: -i * .08, r: 0, vr: 0, g: 0 });
  }
}

drawRoom(); drawDoor(); doorOpen(0); drawTable(); drawBelle(); drawClip(); drawHud();
showTitle();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

window.__T = {
  get mode() { return MODE; }, get save() { return SAVE; }, get P() { return P; }, get V() { return V; },
  zielXY, frei, KRANK, SEAT, PS, GERAETE, get step() { return P && P.stepDone ? curStep() : null; },
