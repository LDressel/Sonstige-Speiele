    let ks, notfall = false;
    if (i === 0 && neu.krank && neu.krank.length) ks = [neu.krank[0]];
    else if (i === 0 && neu.zwei) ks = pick(paare).slice();
    else if (i === 0 && neu.notfall) { notfall = true; ks = [pick(['bruch', 'schramme'])]; }
    else if (day === 1) ks = [['splitter', 'fieber', 'schramme'][i]];
    else {
      let k; do { k = pick(f.krank); } while (k === lastK && f.krank.length > 1);
      ks = [k];
      if (f.zwei && paare.length && Math.random() < (day >= 11 ? .3 : .25)) ks = pick(paare).slice();
      if (f.notfall && !notfallHeute && i >= 2 && Math.random() < .5) {
        notfall = true; const np = paare.filter(p => p.includes('bruch') || p.includes('schramme'));
        ks = Math.random() < .5 || !np.length ? [pick(['bruch', 'schramme'])] : pick(np).slice();
      }
    }
    if (notfall) notfallHeute = true;
    let a; do { a = pick(TIER_IDS); } while (a === lastA);
    list.push({ a, ks, notfall }); lastA = a; lastK = ks[0];
  }
  // Nachkontrolle: höchstens eine pro Tag, als zweiter Patient
  if (SAVE && SAVE.kontrollen) {
    const i = SAVE.kontrollen.findIndex(k => k.due <= day);
    if (i >= 0) { const k = SAVE.kontrollen.splice(i, 1)[0]; list.splice(Math.min(1, list.length), 0, { a: k.a, ks: ['kontrolle'], kontrolle: true }); }
  }
  // Nicht zweimal dasselbe Tier hintereinander
  for (let i = 1; i < list.length; i++) if (list[i].a === list[i - 1].a) {
    const j = list[i].kontrolle ? i - 1 : i, nb = [list[j - 1], list[j + 1]].filter(Boolean).map(p => p.a);
    list[j].a = pick(TIER_IDS.filter(t => !nb.includes(t)));
  }
  return list;
}

/* ---------------- Spielstand ---------------- */
const SAVEKEY = 'belle-tierarzt-v1';
let SAVE = null;
function newSave() { return { day: 1, pat: 0, list: null, buch: {}, geheilt: 0, kontrollen: [], station: [], erklaert: {}, sterne: 0, tagSterne: 0 }; }
function save() { try { localStorage.setItem(SAVEKEY, JSON.stringify(SAVE)); } catch (e) {} }
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVEKEY)); } catch (e) { return null; } }

/* Erklärungen nur beim ersten Mal: danach bleibt die Stimme still (Lautsprecher-Knopf wiederholt) */
function erstmal(id) {
  if (!SAVE) return true;
  if (!SAVE.erklaert) SAVE.erklaert = {};
  if (SAVE.erklaert[id]) return false;
  SAVE.erklaert[id] = 1; save(); return true;
}
async function sayErst(id, opt = {}) {
  if (erstmal(id)) return say(id, opt);
  if (opt.instr) { V.last = id; V.rep = 0; }
}
// Alte Spielstände: was schon oft gehört wurde, gilt als erklärt (neue Minispiele nicht)
function altesErklaert() {
  const e = SAVE.erklaert = {};
  if (!SAVE.geheilt) return;
  ['tag_1', 'koffer_1', 'untersuchen', 'noch_ein_geraet', 'klemmbrett', 'diagnose', 'falsch', 'noch_was', 'zwei_hinweis', 'kontrolle_start', 'kontrolle_fertig',
    'station_bleibt', 'station_nacht', 'station_morgen', 'notfall', 'notfall_gut', 'feierabend', 'morgen', 'buch_auf'].forEach(id => e[id] = 1);
  const f = frei(SAVE.day);
  for (const k of f.krank) { e['karte_' + k] = e['richtig_' + k] = 1; for (const s of KRANK[k].schritte) if (s.art !== 'mini') e['schritt_' + s.item] = 1; }
  for (const t of f.geraete) for (const id of Object.values(BEFUND[t])) e[id] = 1;
}

  };

const has = k => P && P.ks.includes(k);

function setMood(m) {

function zielXY(z) { const p = z === 'ohr' ? OHR[P.a] : ZIEL[z]; return L2S(p[0], p[1]); }
function zielLocal(z) { return z === 'ohr' ? OHR[P.a] : ZIEL[z]; }

function star(cx, cy, R, r, n = 5) {
  let d = '';
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1); }
  return d + 'Z';
}

const PARTS = [];
function burst(x, y, n = 18, colors = ['#FFD84D', '#F57F87', '#8FD0F2', '#B6E39B', '#FFFFFF'], kind = 'star', layer = $('fx')) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(160, 420);
    const e = kind === 'heart' ? el('path', { d: 'M0 8 C-14 -6 -10 -18 0 -10 C10 -18 14 -6 0 8Z', fill: pick(['#F57F87', '#FF9AA8', '#F2575E']) }, layer)
      : el('path', { d: star(0, 0, rnd(8, 14), rnd(4, 6)), fill: pick(colors || ['#FFD84D', '#F57F87', '#8FD0F2', '#B6E39B', '#FFFFFF']) }, layer);
    PARTS.push({ e, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, life: rnd(.8, 1.4), t: 0, r: rnd(0, 360), vr: rnd(-300, 300), g: kind === 'heart' ? -120 : 600 });
  }
}
function floatHearts(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const e = el('path', { d: 'M0 8 C-14 -6 -10 -18 0 -10 C10 -18 14 -6 0 8Z', fill: pick(['#F57F87', '#FF9AA8']) }, $('fx'));
    PARTS.push({ e, x: x + rnd(-60, 60), y: y + rnd(-20, 20), vx: rnd(-20, 20), vy: rnd(-140, -90), life: rnd(1.4, 2.2), t: -i * .15, r: 0, vr: 0, g: 0, sc: rnd(1.2, 2) });
  }
}
function updParts(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const p = PARTS[i]; p.t += dt;
    if (p.t < 0) { p.e.setAttribute('opacity', 0); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    const k = p.t / p.life;
    p.e.setAttribute('transform', `translate(${p.x.toFixed(1)},${p.y.toFixed(1)}) rotate(${p.r.toFixed(0)}) scale(${p.sc || 1})`);
    p.e.setAttribute('opacity', Math.max(0, 1 - k * k).toFixed(2));
    if (k >= 1) { p.e.remove(); PARTS.splice(i, 1); }
  }
}

function shuffleSome(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
// Koffer zum Behandeln: die richtigen Hilfsmittel plus ein paar falsche (ab Tag 2)
function treatTray(steps) {
  const need = [...new Set(steps.map(s => s.item))];
  if (SAVE.day < 2) return shuffleSome(need);
  const pool = [...new Set([].concat(...TREAT_ALL(frei(SAVE.day).krank)))].filter(i => !need.includes(i));
  const extra = Math.min(pool.length, 2 + Math.floor(SAVE.day / 4), 7 - need.length);
  return shuffleSome(need.concat(shuffleSome(pool).slice(0, extra)));
}

function miniLocal(e) { const p = svgPt(e); return { x: p.x - MX, y: p.y - MY, dx: 0, dy: 0, dt: 1 / 60 }; }
function miniDown(e) {
  const m = MINI; if (!m || m.over) return;
  const p = miniLocal(e);
  m.pid = e.pointerId; m.held = true; m.idle = 0; m.dk = null; m.hand.setAttribute('opacity', 0);
  m.lx = p.x; m.ly = p.y; m.lt = performance.now();
  try { ST.setPointerCapture(e.pointerId); } catch (er) {}
  if (m.down) m.down(p);
}
function miniMove(e) {
  const m = MINI; if (!m || m.over || !m.held || e.pointerId !== m.pid) return;
  const p = miniLocal(e), now = performance.now();
  p.dt = Math.max(1 / 120, (now - m.lt) / 1000); p.dx = p.x - m.lx; p.dy = p.y - m.ly;
  m.lx = p.x; m.ly = p.y; m.lt = now; m.idle = 0;
  if (m.move) m.move(p);
}
function miniUp(e) {
  const m = MINI; if (!m || !m.held || e.pointerId !== m.pid) return;
  m.held = false;
  if (!m.over && m.up) m.up(miniLocal(e));
}
function miniTick(dt) {
  const m = MINI; if (!m || m.over) return;
  if (m.tick) m.tick(dt);
  if (!m.held) m.idle += dt;
  if (m.dk) {   // die Hand zeigt, wie es geht: Wegpunkte {x, y, p = gedrückt, ms}
    m.dt += dt * 1000;
    const k = m.dk;
    while (m.di < k.length - 1 && m.dt > k[m.di + 1].ms) { m.dt -= k[m.di + 1].ms; m.di++; }
    if (m.di >= k.length - 1) { m.dk = null; m.hand.setAttribute('opacity', 0); m.idle = 0; return; }
    const a = k[m.di], b = k[m.di + 1], t = easeIO(clamp(m.dt / (b.ms || 1), 0, 1));
    m.hand.setAttribute('transform', `translate(${lerp(a.x, b.x, t).toFixed(1)},${lerp(a.y, b.y, t).toFixed(1)})`);
    m.hand.setAttribute('opacity', .92); m.ring.setAttribute('opacity', a.p ? .6 : 0);

    if (k && k.length > 1) { m.dk = k; m.di = 0; m.dt = 0; m.demoDone = true; }
  }
}
const kf = (x, y, p, ms) => ({ x, y, p, ms });

  const piece = el('g', {}, m.c, lower + (hasKnob ? `<line x1="0" y1="110" x2="${KN[0]}" y2="${KN[1]}" stroke="#FFD84D" stroke-width="6"/><g transform="translate(${KN[0]},${KN[1]})"><circle r="30" fill="#FFD84D" stroke="#FFFFFF" stroke-width="5"/><path d="M-12 -6 A13 13 0 1 1 -6 12" stroke="#9A6A00" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-18 -12 L-12 -4 L-4 -10" stroke="#9A6A00" stroke-width="5" fill="none" stroke-linecap="round"/></g>` : ''));
  let mode = null, ox = 0, oy = 0, done = false;
  const k0 = Math.atan2(KN[1], KN[0]) * 180 / Math.PI;
  const tol = lerp(26, 14, lvl());
  const render = () => piece.setAttribute('transform', `translate(${px.toFixed(1)},${py.toFixed(1)}) rotate(${a.toFixed(1)})`);
  const toLocal = p => { const r = -a * Math.PI / 180, dx = p.x - px, dy = p.y - py; return [dx * Math.cos(r) - dy * Math.sin(r), dx * Math.sin(r) + dy * Math.cos(r)]; };
  const knobWorld = () => { const r = a * Math.PI / 180; return [px + KN[0] * Math.cos(r) - KN[1] * Math.sin(r), py + KN[0] * Math.sin(r) + KN[1] * Math.cos(r)]; };

    if (done || dist(px, py, ...T) > tol || Math.abs(a) > 7) return;

    const [x0, y0, a0] = [px, py, a];

  render();

    down(p) {

      if (hasKnob && dist(lx, ly, ...KN) < 46) { mode = 'rot'; SFX.pick(); return; }
      if (Math.abs(lx) < 75 && ly > -30 && ly < 262) { mode = 'move'; ox = p.x - px; oy = p.y - py; SFX.pick(); }

    move(p) {
      if (mode === 'move') { px = clamp(p.x - ox, -300, 300); py = clamp(p.y - oy, -120, 40); render(); check(); }
      else if (mode === 'rot') { a = angDiff(Math.atan2(p.y - py, p.x - px) * 180 / Math.PI - k0, 0); render(); check(); }
    },
    up() { mode = null; check(); },
    demo() {
      if (done) return null;
      const k = [];
      if (Math.abs(a) > 7) {
        const [kx, ky] = knobWorld(); k.push(kf(kx, ky, 0, 0), kf(kx, ky, 1, 400));
        for (let i = 1; i <= 4; i++) { const aa = (a * (1 - i / 4) + k0) * Math.PI / 180, r = Math.hypot(...KN); k.push(kf(px + r * Math.cos(aa), py + r * Math.sin(aa), i < 4 ? 1 : 0, 300)); }
      }
      k.push(kf(px, py + 80, 0, k.length ? 400 : 0), kf(px, py + 80, 1, 400), kf(T[0], T[1] + 80, 0, 1300), kf(T[0], T[1] + 80, 0, 300));
      return k;
    },
  };
};

/* Gips wickeln: im Kreis um die Pfote fahren – nicht zu schnell */
MG.wickeln = m => {
  const c = TIERE[P.a], CY = 10, R = 175;
  m.c.innerHTML = `<rect x="-400" y="-300" width="800" height="600" fill="#EAF7F2"/>
    <rect x="-70" y="-330" width="140" height="460" rx="60" fill="${c.fur}" stroke="${c.dark}" stroke-width="6"/>
    <ellipse cx="0" cy="170" rx="96" ry="72" fill="${c.fur}" stroke="${c.dark}" stroke-width="6"/><ellipse cx="0" cy="${CY}" rx="60" ry="46" fill="#8E7CC3" opacity=".45"/>`;
  el('circle', { cx: 0, cy: CY, r: R, fill: 'none', stroke: '#FFFFFF', 'stroke-width': 10, 'stroke-dasharray': '18 14', opacity: .9 }, m.c);
  const layers = el('g', {}, m.c);
  const need = 4 + Math.round(lvl() * 2), lim = lerp(2.8, 1.8, lvl()) * 2 * Math.PI;
  const roll = el('g', { opacity: 0 }, m.ui, `<g transform="scale(.8)">${toolIcon('gips')}</g>`);
  let acc = 0, la = null, dir = 0, done = 0, lastF = 0, sp = 0;
  m.pips(need, 0);
  function addLayer() {
    const i = done++, h = 300 / need, y = 120 - (i + 1) * h;
    el('rect', { x: -80, y: y.toFixed(0), width: 160, height: (h + 16).toFixed(0), rx: 16, fill: '#FFFFFF', stroke: '#D5DDE4', 'stroke-width': 4, transform: `rotate(${i % 2 ? 6 : -6} 0 ${y + h / 2})` }, layers);
    m.pips(need, done); SFX.stick();
    if (done >= need) { m.c.querySelector('ellipse[fill="#8E7CC3"]').remove(); m.win(); }
  }
  return {
    down(p) { la = null; sp = 0; roll.setAttribute('opacity', 1); roll.setAttribute('transform', `translate(${p.x},${p.y})`); },
    move(p) {
      roll.setAttribute('transform', `translate(${p.x},${p.y})`);
      const r = dist(p.x, p.y, 0, CY);
      if (r < 90 || r > 340) { la = null; return; }
      const an = Math.atan2(p.y - CY, p.x), now = performance.now();
      if (la !== null) {
        const da = wrapA(an - la);
        if (!dir && Math.abs(da) > .02) dir = Math.sign(da);
        if (Math.sign(da) === dir) {
          sp = sp * .7 + Math.abs(da) / p.dt * .3;
          if (sp > lim && now - lastF > 1000) { lastF = now; sp = 0; m.fail(p.x, p.y - 40); acc = done * 2 * Math.PI; la = an; return; }   // zu schnell: die Binde verrutscht
          acc += Math.abs(da);
          while (acc >= (done + 1) * 2 * Math.PI && done < need) addLayer();
        }
      }
      la = an;
    },
    up() { la = null; roll.setAttribute('opacity', 0); },
    demo() { const k = [kf(R, CY, 0, 0), kf(R, CY, 1, 400)]; for (let i = 1; i <= 14; i++) { const an = i / 12 * 2 * Math.PI; k.push(kf(R * Math.cos(an), CY + R * Math.sin(an), i < 14 ? 1 : 0, 220)); } k.push(kf(R, CY, 0, 300)); return k; },
  };
};

  el('path', { d: 'M-30 -85 h60', stroke: '#F2575E', 'stroke-width': 6, 'stroke-linecap': 'round' }, meter);
  let grab = false, pulled = 0, y0 = 0, x0 = 0, sp = 0, dx = 0, out = false;
  const h = () => pulled * .32;   // so weit hebt sich die Haut mit
  const grip = () => [dx, SK - 6 - h()];
  function render() {
    const b = h();
    skin.setAttribute('d', `M-420 ${SK} L-130 ${SK} C-60 ${SK} -45 ${SK - b} 0 ${SK - b} C45 ${SK - b} 60 ${SK} 130 ${SK} L420 ${SK} L420 320 L-420 320Z`);

/* Flöhe fangen: schnell antippen, bevor sie weghüpfen */
MG.floehe = m => {
  m.c.innerHTML = furBg(P.a);
  el('g', { transform: 'translate(318,-226)' }, m.ui, `<circle r="44" fill="#FFFFFF" opacity=".9"/><g transform="scale(.9)">${toolIcon('fangglas')}</g>`);
  const need = 8 + Math.round(lvl() * 4), max = 3 + Math.round(lvl() * 2), life = lerp(6, 3.6, lvl()), sitT = lerp(1, .55, lvl());
  const F = []; let caught = 0, esc = 0;
  function spawn() { const f = { x: rnd(-300, 300), y: rnd(-190, 230), t: 0, age: 0, mode: 'sit', d: rnd(.4, 1) * sitT, e: el('g', {}, m.c, FLOH) }; f.e.setAttribute('transform', `translate(${f.x},${f.y})`); F.push(f); }
  m.pips(need, 0);
  return {
    tick(dt) {
      while (F.filter(f => f.mode !== 'weg').length < max && caught + F.filter(f => f.mode !== 'weg').length < need) spawn();
      for (let i = F.length - 1; i >= 0; i--) {
        const f = F[i]; f.age += dt; f.t += dt;

    demo() { const f = F.find(o => o.mode === 'sit'); if (!f) return null; return [kf(f.x + 60, f.y + 60, 0, 0), kf(f.x, f.y + 10, 0, 300), kf(f.x, f.y + 10, 1, 150), kf(f.x, f.y + 10, 0, 150), kf(f.x, f.y + 10, 0, 400)]; },

  m.c.innerHTML = `<rect x="-400" y="-300" width="800" height="600" fill="#FFF6EA"/><rect x="-400" y="110" width="800" height="200" fill="#F3D9B6"/>`;
  const ids = Object.keys(KRAUT), K = 3 + (lvl() > .4 ? 1 : 0), rez = shuffleSome(ids).slice(0, K), order = shuffleSome(ids);
  const card = el('g', { transform: 'translate(0,-160)' }, m.c);
  el('rect', { x: -K * 60 - 20, y: -70, width: K * 120 + 40, height: 140, rx: 26, fill: '#FFFFFF', stroke: '#F2D5C2', 'stroke-width': 6 }, card);
  const slots = rez.map((id, i) => {
    const g = el('g', { transform: `translate(${(i - (K - 1) / 2) * 120},0)` }, card);
    el('g', { transform: 'scale(.95)' }, g, KRAUT[id]);
    const cover = el('g', { opacity: 0 }, g, `<rect x="-48" y="-52" width="96" height="104" rx="18" fill="#8FC7B8"/><text y="20" text-anchor="middle" font-size="56" fill="#FFFFFF">?</text>`);
    const ok = el('g', { opacity: 0 }, g, `<circle cx="38" cy="-40" r="18" fill="#5BBF4A" stroke="#FFF" stroke-width="4"/><path d="M30 -40 l6 6 l10 -12" stroke="#FFF" stroke-width="5" fill="none" stroke-linecap="round"/>`);
    return { cover, ok };
  });
  const pot = el('g', { transform: 'translate(0,20) scale(1.5)' }, m.c, toolIcon('tee'));
  const jars = order.map((id, j) => {
    const x = (j - 2.5) * 122, y = 196;
    const g = el('g', { transform: `translate(${x},${y})` }, m.c, `<circle r="54" fill="#FFFFFF" stroke="#E2BE8E" stroke-width="5"/><g transform="scale(.85)">${KRAUT[id]}</g>`);
    return { id, x, y, g };
  });
  let idx = 0, show = true, tok = 0;
  function showRez(ms) {
    show = true; const my = ++tok;
    slots.forEach((s, i) => s.cover.setAttribute('opacity', 0));
    m.later(ms, () => { if (my !== tok) return; slots.forEach((s, i) => { if (i >= idx) s.cover.setAttribute('opacity', 1); }); show = false; SFX.whoosh(); });
  }
  showRez(lerp(3600, 2400, lvl()) + K * 300);
  m.pips(K, 0);
  return {
    down(p) {
      if (show) return;
      const j = jars.find(o => dist(p.x, p.y, o.x, o.y) < 60); if (!j) return;
      if (j.id === rez[idx]) {
        const fly = el('g', {}, m.ui, KRAUT[j.id]);
        guard(tween(400, t => fly.setAttribute('transform', `translate(${lerp(j.x, 0, t)},${lerp(j.y, 10, t) - Math.sin(t * Math.PI) * 80}) scale(${1 - t * .5})`)).then(() => fly.remove()));
        slots[idx].cover.setAttribute('opacity', 0); slots[idx].ok.setAttribute('opacity', 1);
        idx++; m.pips(K, idx); SFX.plop();
        if (idx >= K) { burst(MX, MY, 14, ['#FFFFFF', '#F2C14E', '#9BD47F'], 'star', $('fx2')); m.win(); }
      } else {
        m.fail(j.x, j.y - 70);
        const g = j.g; guard(tween(400, t => g.setAttribute('transform', `translate(${j.x + Math.sin(t * Math.PI * 6) * 10 * (1 - t)},${j.y})`)));
        showRez(1500);
      }
    },
    demo() { const j = jars.find(o => o.id === rez[idx]); return [kf(0, -160, 0, 0), kf(0, -160, 0, 900), kf(j.x, j.y, 0, 700), kf(j.x, j.y, 1, 300), kf(j.x, j.y, 0, 150), kf(j.x, j.y, 0, 400)]; },
  };
};

/* Gips aufschneiden: genau an der gestrichelten Linie entlangfahren */
MG.schnitt = m => {
  m.c.innerHTML = furBg(P.a) + `<rect x="-420" y="-120" width="840" height="240" rx="44" fill="#FFFFFF" stroke="#D5DDE4" stroke-width="6"/>` +
    [-300, -180, -60, 60, 180, 300].map(x => `<path d="M${x} -116 q20 120 0 232" stroke="#E6ECF0" stroke-width="5" fill="none"/>`).join('');
  const A = lerp(14, 46, lvl()), f = rnd(.8, 1.4), ph = rnd(0, 6), pts = [];
  for (let x = -330; x <= 330; x += 15) pts.push([x, A * Math.sin(x / 70 * f + ph)]);
  const D = a => 'M' + a.map(q => q[0] + ' ' + q[1].toFixed(1)).join(' L');
  el('path', { d: D(pts), stroke: '#9AA7AF', 'stroke-width': 6, fill: 'none', 'stroke-dasharray': '14 10', 'stroke-linecap': 'round' }, m.c);
  const cut = el('path', { stroke: '#5E6B75', 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round' }, m.c);
  const mark = el('circle', { r: 26, fill: '#5BBF4A', opacity: .55 }, m.c);
  const sc = el('g', { opacity: 0 }, m.ui, `<g transform="scale(1.1)">${toolIcon('gipsschere')}</g>`);
  const tol = lerp(34, 20, lvl());
  let prog = 0, cutting = false, lastF = 0, t = 0;
  const render = () => { cut.setAttribute('d', D(pts.slice(0, prog + 1)) + (prog === 0 ? ' l0 0' : '')); mark.setAttribute('cx', pts[prog][0]); mark.setAttribute('cy', pts[prog][1]); };
  render();
  return {
    tick(dt) { t += dt; mark.setAttribute('r', (24 + Math.sin(t * 6) * 5).toFixed(1)); },
    down(p) { sc.setAttribute('opacity', 1); sc.setAttribute('transform', `translate(${p.x},${p.y})`); if (dist(p.x, p.y, ...pts[prog]) < 60) cutting = true; },
    move(p) {
      sc.setAttribute('transform', `translate(${p.x},${p.y})`);
      if (!cutting) return;
      let best = prog, bd = 1e9;
      for (let i = Math.max(0, prog - 2); i <= Math.min(pts.length - 1, prog + 5); i++) { const d = dist(p.x, p.y, ...pts[i]); if (d < bd) { bd = d; best = i; } }
      if (bd > tol * 2.2) {   // von der Linie abgerutscht
        const now = performance.now(); if (now - lastF > 700) { lastF = now; m.fail(p.x, p.y - 40); }
        cutting = false; prog = Math.max(0, prog - 3); render(); return;
      }
      if (bd < tol && best > prog) { prog = best; SFX.rub(); render(); if (prog >= pts.length - 1) m.win(); }
    },
    up() { cutting = false; sc.setAttribute('opacity', 0); },
    demo() { const k = [kf(...pts[prog], 0, 0), kf(...pts[prog], 1, 400)]; for (let i = prog + 3; i < Math.min(pts.length - 1, prog + 18); i += 3) k.push(kf(...pts[i], 1, 300)); k.push(kf(...pts[Math.min(pts.length - 1, prog + 18)], 1, 300)); const l = k[k.length - 1]; k.push(kf(l.x, l.y, 0, 200)); return k; },
  };
};
function foam(n, area, host) {
  // Schaumblasen (bleiben über Schritte hinweg in P.foam)
  if (!P.foam) P.foam = el('g', {}, host || P.ovTop);
  while (P.foam.childNodes.length < n) {
    const [cx, cy, rx, ry] = area;
    el('circle', { cx: (cx + rnd(-rx, rx)).toFixed(0), cy: (cy + rnd(-ry, ry)).toFixed(0), r: rnd(6, 13).toFixed(1), fill: '#FFFFFF', stroke: '#BFE3F5', 'stroke-width': 2, opacity: .92 }, P.foam);
  }
}
function rubVisual(item, k) {
  if (item === 'tupfer' && P.sym.dreck) { P.sym.dreck.setAttribute('opacity', 1 - k); P.sym.kratzer.setAttribute('opacity', 1 - k * .5); }
  if (item === 'gips') {
    if (!P.gips) P.gips = el('g', {}, P.ovArm, `<path d="M-48 -112 C-64 -90 -68 -64 -64 -42" stroke="#FFFFFF" stroke-width="40" fill="none" stroke-linecap="round"/>
      <ellipse cx="-62" cy="-34" rx="30" ry="23" fill="#FFFFFF" stroke="#D5DDE4" stroke-width="4"/>
      ${[-100, -84, -68, -52].map(y => `<path d="M-84 ${y} q20 8 40 -2" stroke="#D5DDE4" stroke-width="3" fill="none"/>`).join('')}`);
    P.gips.setAttribute('opacity', (.15 + .85 * k).toFixed(2));
    if (k >= 1 && P.sym.blau) P.sym.blau.remove();
  }
  if (item === 'gipsschere' && P.gips) {
    P.gips.setAttribute('opacity', (1 - k).toFixed(2));
    if (P.gipsSticker) P.gipsSticker.setAttribute('opacity', (1 - k).toFixed(2));
    if (k >= 1) { P.gips.remove(); P.gips = null; if (P.gipsSticker) P.gipsSticker.remove(); }
  }
  if (item === 'zahnbuerste') {
    foam(Math.round(k * 9), [0, -166, 30, 10], P.ovHead);
    if (k >= 1) { P.foam.remove(); P.foam = null; }
  }
  if (item === 'shampoo') {
    foam(Math.round(k * 34), [0, -100, 70, 80]);
    if (P.fleas) P.fleas.forEach(f => f.e.setAttribute('opacity', (1 - k).toFixed(2)));
    if (k >= 1 && P.fleas) { P.fleas.forEach(f => f.e.remove()); P.fleas = null; }
  }
  if (item === 'handtuch' && P.foam) {
    P.foam.setAttribute('opacity', (1 - k).toFixed(2));
    if (k >= 1) { P.foam.remove(); P.foam = null; }
  }
}

/* =========================================================
   PATIENTENBUCH
   ========================================================= */
let BOOK_PREV = null;
function openBook() {
  if (!SAVE || (MODE !== 'exam' && MODE !== 'treat') || DRAG) return;
  BOOK_PREV = MODE; MODE = 'buch'; HUD.bookDot.style.display = 'none';
  stopVoice();
  const m = $('modal'); clear(m);
  el('rect', { x: 0, y: 0, width: 1200, height: 900, fill: '#2F4A44', opacity: .5 }, m);
  const b = el('g', {}, m);
  b.innerHTML = `<rect x="70" y="120" width="1060" height="700" rx="40" fill="#F57F87" filter="url(#sh)"/><rect x="92" y="140" width="1016" height="660" rx="28" fill="#FFF8EE"/>
    <line x1="600" y1="150" x2="600" y2="790" stroke="#F2D5C2" stroke-width="6"/>`;
  const entries = KRANK_ORDER.map(k => ({ id: 'k_' + k, k, art: 'k' })).concat(GERAET_ORDER.map(t => ({ id: 'g_' + t, k: t, art: 'g' })));

  entries.forEach((en, i) => {
    const nk = KRANK_ORDER.length, links = i < nk, j = links ? i : i - nk;
    const col = links ? j % 4 : j % 3, row = links ? Math.floor(j / 4) : Math.floor(j / 3);
    const x = links ? 168 + col * 122 : 728 + col * 128, y = 252 + row * 196;
    const have = SAVE.buch[en.id], neu = have === 2;
    const g = el('g', { class: 'btn', transform: `translate(${x},${y})` }, m);
    g.innerHTML = `<rect x="-54" y="-84" width="108" height="168" rx="18" fill="${have ? '#FFFFFF' : '#ECE7E0'}" stroke="${neu ? '#FFD84D' : '#E9D9C9'}" stroke-width="${neu ? 7 : 4}"/>
      ${have ? `<g transform="translate(0,-2) scale(${en.art === 'k' ? .47 : .92})">${en.art === 'k' ? krankBild(en.k) : toolIcon(en.k)}</g>` : `<text y="22" text-anchor="middle" font-size="66" fill="#CFC6BB">?</text>`}`;
    g.addEventListener('pointerdown', e => {
      e.stopPropagation(); SFX.pop();
      if (!have) { guard(say('buch_zu')); return; }
      if (SAVE.buch[en.id] === 2) { SAVE.buch[en.id] = 1; save(); g.querySelector('rect').setAttribute('stroke', '#E9D9C9'); g.querySelector('rect').setAttribute('stroke-width', 4); }
      m.querySelectorAll('.bookHl').forEach(n => n.remove());
      el('rect', { class: 'bookHl', x: -61, y: -91, width: 122, height: 182, rx: 22, fill: 'none', stroke: '#5BBF4A', 'stroke-width': 8 }, g);
      guard(say(en.art === 'k' ? 'buch_' + en.k : GERAETE[en.k].buch));
    });
  });
  const x = el('g', { class: 'btn', transform: 'translate(1110,150)' }, m, `<circle r="40" fill="#FFFFFF" filter="url(#shS)"/><path d="M-14 -14 L14 14 M14 -14 L-14 14" stroke="#9AA7AF" stroke-width="8" stroke-linecap="round"/>`);
  x.addEventListener('pointerdown', e => { e.stopPropagation(); SFX.pop(); closeBook(); });
  BOOK_VLAST = V.last;
  guard(sayErst('buch_auf'));
}
let BOOK_VLAST = null;
function closeBook() {
  stopVoice(); clear($('modal'));
  MODE = BOOK_PREV || 'exam'; V.last = BOOK_VLAST;
  if (MODE === 'diag') MODE = 'exam';  // Karten wurden durchs Buch geschlossen
  if (MODE === 'end' || MODE === 'intro' || MODE === 'arrive') { /* läuft weiter */ }
}

/* =========================================================
   ANIMATION (Blinzeln, Atmen, Schwanz, Hinweise)
   ========================================================= */
function setBelle(x, y, s) { BELLE.x = x; BELLE.y = y; BELLE.s = s; }
let last = performance.now(), TIME = 0, blinkT = 2, pBlinkT = 3, talkT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TIME += dt; idle += dt;
  // Belle
  if (BELLE.g) {
    BELLE.bounce = Math.max(0, BELLE.bounce - dt * 1.6);
    const by = -Math.abs(Math.sin(BELLE.bounce * Math.PI * 2)) * 40 * BELLE.bounce;
    const br = 1 + Math.sin(TIME * 2) * .008;
    BELLE.g.setAttribute('transform', `translate(${BELLE.x},${BELLE.y + by}) scale(${BELLE.s || 1},${(BELLE.s || 1) * br})`);
    BELLE.tail.setAttribute('transform', `rotate(${Math.sin(TIME * 1.6) * 6} 50 -70)`);
    BELLE.head.setAttribute('transform', `rotate(${Math.sin(TIME * .9) * 2} 0 -230)`);
    blinkT -= dt; const bl = blinkT < 0 ? .1 : 1; if (blinkT < -.13) blinkT = rnd(2, 5);
    BELLE.eyes.setAttribute('transform', `translate(0,-307) scale(1,${bl}) translate(0,307)`);
  }
  // Patient
  if (P && P.g.isConnected && $('patWrap').style.display !== 'none') {
    let hj = 0;
    if (P.cough > 0) { P.coughT -= dt * (P.cough > .5 ? 1 : .35); if (P.coughT < 0) { P.coughT = rnd(2.5, 4); coughPuff(); } const c = P.coughT > 2.3 ? Math.sin((P.coughT - 2.3) * 20) * 6 : 0; hj = c; }
    const br = Math.sin(TIME * 2.4) * .012;
    P.body.setAttribute('transform', `translate(0,-10) scale(1,${1 + br}) translate(0,10)`);
    P.head.setAttribute('transform', `translate(0,${hj + Math.sin(TIME * 2.4) * 1.5}) rotate(${P.mood === 'sick' ? -4 + Math.sin(TIME) * 1.5 : Math.sin(TIME * 3) * 4} 0 -150)`);
    P.tail.setAttribute('transform', `rotate(${Math.sin(TIME * (P.mood === 'happy' ? 8 : 1.5)) * (P.mood === 'happy' ? 10 : 3)} 60 -40)`);
    pBlinkT -= dt; const pb = pBlinkT < 0 ? .12 : (P.mood === 'sick' && has('fieber') && !P.healed ? .6 : 1); if (pBlinkT < -.13) pBlinkT = rnd(2, 4.5);
    P.eyes.setAttribute('transform', `translate(0,-218) scale(1,${pb}) translate(0,218)`);
    if (has('splitter') || has('schramme') || has('bruch')) P.armR.setAttribute('transform', P.healed ? '' : `translate(0,${-6 + Math.sin(TIME * 3) * 2})`);
    if (P.fleas) for (const f of P.fleas) {
      if (f.x1 === undefined) { f.x0 = f.x1 = f.x; f.y0 = f.y1 = f.y; f.d = rnd(.5, 1.4); }
      f.t += dt;
      if (f.t > f.d) { f.t = 0; f.d = rnd(.5, 1.4); f.x0 = f.x1; f.y0 = f.y1; f.x1 = rnd(-62, 62); f.y1 = rnd(-175, -30); }
      const k = Math.min(1, f.t / .22);
      f.e.setAttribute('cx', lerp(f.x0, f.x1, k).toFixed(1)); f.e.setAttribute('cy', (lerp(f.y0, f.y1, k) - Math.sin(k * Math.PI) * 26).toFixed(1));
    }
    // Sprechen
    const talking = V.speaking && V.who === 'tier';
    talkT += dt;
    if (talking) { const o = Math.sin(talkT * 22) > 0; P.mO.style.display = o ? '' : 'none'; P.mH.style.display = o || P.mood === 'sick' ? 'none' : ''; P.mS.style.display = o || P.mood !== 'sick' ? 'none' : ''; P.talk = true; }
    else if (P.talk) { P.talk = false; setMood(P.mood); }
  }
  // Klemmbrett pulsiert
  if (CLIP.g) { const k = CLIP.pulse ? 1 + Math.sin(TIME * 6) * .05 : 1; CLIP.g.setAttribute('transform', `translate(${CLIP.x},${CLIP.y}) rotate(${-6 + (CLIP.pulse ? Math.sin(TIME * 6) * 2 : 0)}) scale(${k})`); }
  // Lautsprecher-Wellen
  if (HUD.w1) { const on = V.speaking && V.who !== 'tier'; HUD.w1.setAttribute('opacity', on ? (.5 + .5 * Math.sin(TIME * 12)).toFixed(2) : 1); HUD.w2.setAttribute('opacity', on ? (.5 + .5 * Math.sin(TIME * 12 + 1.5)).toFixed(2) : 1); }
  // Titel-Knopf
  if (TITLE_PULSE && TITLE_PULSE.isConnected) { const k = 1 + Math.sin(TIME * 4) * .05; const tr = TITLE_PULSE.getAttribute('transform').replace(/ scale\([^)]*\)/, ''); TITLE_PULSE.setAttribute('transform', tr + ` scale(${k})`); }
  if (REVEAL) REVEAL.setAttribute('transform', `rotate(${TIME * 20})`);
  // Hinweis im Koffer (erst nach längerem Warten)
  const hint = (MODE === 'treat' && idle > 14 && P && P.stepDone) ? curStep().item : TRAY_HINT;
  $('tray').querySelectorAll('.slot').forEach(s => { const on = s.getAttribute('data-item') === hint; s.querySelector('.slotHi').setAttribute('opacity', on ? (.6 + .4 * Math.sin(TIME * 8)).toFixed(2) : 0); });
  // Notfall: Zeitbalken
  if (HUD.nf) {
    const on = P && P.notfall && P.t0 && !P.healed && MODE !== 'title';
    HUD.nf.style.display = on ? '' : 'none';
    if (on) {
      const k = clamp(1 - (performance.now() - P.t0) / P.limit, 0, 1);
      if (k <= 0) P.zuSpaet = true;
      HUD.nfF.setAttribute('width', (364 * k).toFixed(1));
      HUD.nfF.setAttribute('fill', k < .25 ? (Math.sin(TIME * 12) > 0 ? '#F2575E' : '#FFB0B0') : k < .5 ? '#F2A33A' : '#5BBF4A');
    }
  }
  if (MINI) { miniTick(dt); idle = 0; }
  updParts(dt);
  requestAnimationFrame(frame);
}
function coughPuff() {
  const [x, y] = L2S(34, -160); SFX.cough();
  for (let i = 0; i < 3; i++) {
    const e = el('circle', { r: rnd(10, 18), fill: '#FFFFFF', stroke: '#C9D5DE', 'stroke-width': 3 }, $('fx'));
    PARTS.push({ e, x: x + i * 10, y: y + rnd(-6, 6), vx: rnd(60, 120), vy: rnd(-30, 10), life: .9, t: -i * .08, r: 0, vr: 0, g: 0 });
  }
}

/* Test-Zugang (nur für automatische Tests) */
window.__T = {
  get mode() { return MODE; }, get save() { return SAVE; }, get P() { return P; }, get V() { return V; },
  zielXY, frei, KRANK, SEAT, PS, GERAETE, get step() { return P && P.stepDone ? curStep() : null; },
  endBtn() { const b = [...document.querySelectorAll('#modal g.btn')].pop(); if (!b) return null; const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(b.getAttribute('transform')); return [+m[1], +m[2]]; },
  get diagBusy() { return !DIAG || DIAG.busy; }, get mini() { return MINI; }, MG,
  cards() { return [...document.querySelectorAll('#modal g.btn')].filter(g => g._k).map(g => [g._k, g._x, 470]); },
  slotXY(it) { const s = traySlot(it); return s ? [s._x, s._y] : null; },
