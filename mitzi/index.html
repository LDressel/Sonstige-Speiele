const W = 1200, H = 900;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let DPR = 1, S = 1, OX = 0, OY = 0, VW = 0, VH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
  S = Math.min(VW / W, VH / H); OX = (VW - W * S) / 2; OY = (VH - H * S) / 2;
}
addEventListener('resize', resize); resize();

const FONT = 'ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l = dx * dx + dy * dy || 1;
  const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / l, 0, 1);
  return dist(p.x, p.y, a.x + t * dx, a.y + t * dy);
}
let TIME = 0, idle = 0;

/* ---------------- Audio (alles synthetisch, offline) ---------------- */
let AC = null, MASTER = null, NOISE = null;
function audioInit() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.8; MASTER.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function env(g, t0, a, d, vol) { g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
function tone(f1, f2, dur, type = 'sine', vol = 0.2, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  env(g, t0, Math.min(0.02, dur / 4), dur, vol); o.connect(g); g.connect(MASTER); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseBuf() {
  if (NOISE) return NOISE;
  const b = AC.createBuffer(1, AC.sampleRate, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return NOISE = b;
}
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0, q = 1) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(); s.buffer = noiseBuf();
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); env(g, t0, 0.01, dur, vol);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t0); s.stop(t0 + dur + 0.05);
}
function meow(p = 1, delay = 0, vol = 0.3) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; f.type = 'bandpass'; f.Q.value = 3;
  o.frequency.setValueAtTime(480 * p, t0); o.frequency.linearRampToValueAtTime(720 * p, t0 + .15); o.frequency.linearRampToValueAtTime(520 * p, t0 + .5);
  f.frequency.setValueAtTime(900 * p, t0); f.frequency.linearRampToValueAtTime(1900 * p, t0 + .15); f.frequency.linearRampToValueAtTime(1000 * p, t0 + .5);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .05); g.gain.setValueAtTime(vol, t0 + .3); g.gain.exponentialRampToValueAtTime(0.0001, t0 + .55);
  o.connect(f); f.connect(g); g.connect(MASTER); o.start(t0); o.stop(t0 + .6);
}

const SFX = {

  twinkle: () => [1319, 1568, 2093, 2637].forEach((f, i) => tone(f, f, .14, 'sine', .08, i * .06)),
  bonk: () => { tone(220, 70, .25, 'square', .1); noise(.25, .45, 600); },

  ufo: () => { for (let i = 0; i < 8; i++) tone(500, 900, .18, 'sine', .06, i * .2); },

const SY = window.speechSynthesis || null;
const VOICE = { v: null, speaking: false, tok: 0, pend: null, last: null, rep: 0, unlocked: false, u: null };
let VGEN = 0;
function pickVoice() {
  if (!SY) return;
  let vs = []; try { vs = SY.getVoices().filter(v => /^de([-_]|$)/i.test(v.lang)); } catch (e) {}
  const bad = /grandpa|grandma|opa|oma|eddy|reed|rocko|markus|yannick|thorsten|stefan|conrad|jonas|male|männ|albert|bahh|bells|boing|bubbles|cellos|jester|organ|trinoids|whisper|zarvox|wobble|superstar|news|junior|ralph|fred|kathy|killian|florian|bernd/i;
  const good = /anna|helena|petra|marlene|katja|vicki|hedda|sandy|shelley|female|seraphina|amala|elke|louisa|gisela|ingrid|klarissa|maja|tanja|tamara|ingrid|carla/i;
  let best = null, bs = -1e9;
  for (const v of vs) {
    let s = 0;
    if (/premium/i.test(v.name)) s += 8;
    if (/enhanced|erweitert|natural|neural|online/i.test(v.name)) s += 6;
    if (good.test(v.name)) s += 4;
    if (bad.test(v.name)) s -= 20;
    if (/de[-_]DE/i.test(v.lang)) s += 2;
    if (v.localService) s += 1;
    if (s > bs) { bs = s; best = v; }
  }
  VOICE.v = best;
}
if (SY) { pickVoice(); try { SY.addEventListener('voiceschanged', pickVoice); } catch (e) { SY.onvoiceschanged = pickVoice; } }
function voiceUnlock() {
  if (VOICE.unlocked || !SY) return; VOICE.unlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'de-DE'; SY.speak(u); } catch (e) {}
}
function voiceStop() { VGEN++; VOICE.pend = null; VOICE.speaking = false; VOICE.last = null; try { if (SY) SY.cancel(); } catch (e) {} }
/* say(id, cb, instr): Satz sprechen. cb kommt danach (auch wenn unterbrochen).
   instr = Anweisung, die der Mama-Knopf wiederholt. */
function say(id, cb, instr) {
  const txt = LINES[id] || id;
  if (instr) { VOICE.last = id; VOICE.rep = 0; }
  if (VOICE.pend) { const p = VOICE.pend; VOICE.pend = null; p(); }
  const gen = VGEN, tok = ++VOICE.tok; let done = false;
  const fin = () => {
    if (done) return; done = true;
    if (VOICE.tok === tok) { VOICE.speaking = false; VOICE.pend = null; }
    if (cb && gen === VGEN) cb();
  };
  VOICE.pend = fin; VOICE.speaking = true;
  setTimeout(fin, 2200 + txt.length * 95);
  if (!SY) return;
  try {
    const busy = SY.speaking || SY.pending;
    SY.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'de-DE'; if (VOICE.v) u.voice = VOICE.v;
    u.rate = .95; u.pitch = 1.08; u.volume = 1;
    u.onend = fin; u.onerror = fin; VOICE.u = u;
    if (busy) setTimeout(() => { if (VOICE.tok === tok) SY.speak(u); }, 60); else SY.speak(u);
  } catch (e) {}
}

/* ---------------- Farben ---------------- */
const MITZI = { b: '#2B262D', bib: '#FFFFFF', eye: '#F5C842', ear: '#F4A3B4', line: '#7D7388', nose: '#F28AA0', feat: '#D8D0DE', whisk: '#E9E4EE' };
const BELL = { b: '#8E8B90', paw: '#FFFFFF', bib: '#B9B6BB', muzzle: '#FFFFFF', eye: '#7CC456', ear: '#F4A3B4', line: '#3E3A40', nose: '#E9788F', feat: '#2E2A30', whisk: '#F4F2F6', stripes: '#2E2A30', tabby: true, bell: true };
const GOLD = '#FFD54A', GOLDD = '#C98A12';

/* ---------------- Spielstand ---------------- */
const SAVEKEY = 'mitzi-spielstand-1';
function saveGame(idx) { try { localStorage.setItem(SAVEKEY, JSON.stringify({ idx })); } catch (e) {} }

/* ---------------- Katzen ---------------- */
function headFront(pal, R, o = {}) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const lw = Math.max(1.5, R * .085);
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(sx * R * .92, -R * .3); ctx.lineTo(sx * R * .8, -R * 1.22); ctx.lineTo(sx * R * .18, -R * .8); ctx.closePath(); fs(pal.b); st(pal.line, lw);
    ctx.beginPath(); ctx.moveTo(sx * R * .76, -R * .42); ctx.lineTo(sx * R * .72, -R * 1.0); ctx.lineTo(sx * R * .34, -R * .76); ctx.closePath(); fs(pal.ear);
  }
  ell(0, 0, R, R * .9); fs(pal.b);
  if (pal.stripes) {
    ctx.beginPath(); ctx.moveTo(0, -R * .86); ctx.lineTo(0, -R * .55); ctx.moveTo(-R * .26, -R * .82); ctx.lineTo(-R * .2, -R * .58); ctx.moveTo(R * .26, -R * .82); ctx.lineTo(R * .2, -R * .58);
    st(pal.stripes, lw * 1.4);
  }
  if (pal.tabby) { ctx.beginPath(); for (const sx of [-1, 1]) { ctx.moveTo(sx * R, R * .05); ctx.lineTo(sx * R * .66, R * .1); ctx.moveTo(sx * R * .96, R * .3); ctx.lineTo(sx * R * .64, R * .28); } st(pal.stripes, lw * 1.3); }
  if (pal.muzzle) { ell(0, R * .36, R * .44, R * .32); fs(pal.muzzle); }
  ell(0, 0, R, R * .9); st(pal.line, lw);
  const ex = R * .38, ey = -R * .08;
  for (const sx of [-1, 1]) {
    if (o.blink || o.happy) {
      ctx.beginPath();
      if (o.happy) ctx.arc(sx * ex, ey + R * .1, R * .16, 1.15 * Math.PI, 1.85 * Math.PI);
      else ctx.arc(sx * ex, ey - R * .04, R * .16, .15 * Math.PI, .85 * Math.PI);
      st(pal.feat, lw);
    } else {
      ell(sx * ex, ey, R * .19, R * .23); fs(pal.eye);
      ell(sx * ex + (o.lx || 0) * R * .06, ey + (o.ly || 0) * R * .07, R * .1, R * .18); fs('#141014');
      circ(sx * ex + R * .07, ey - R * .09, R * .065); fs('#fff');
    }
  }
  ctx.beginPath(); ctx.moveTo(-R * .1, R * .2); ctx.lineTo(R * .1, R * .2); ctx.lineTo(0, R * .32); ctx.closePath(); fs(pal.nose);
  ctx.beginPath(); ctx.moveTo(0, R * .32); ctx.quadraticCurveTo(-R * .06, R * .46, -R * .2, R * .42); ctx.moveTo(0, R * .32); ctx.quadraticCurveTo(R * .06, R * .46, R * .2, R * .42);
  st(pal.feat, lw * .8);
  ell(-R * .62, R * .28, R * .16, R * .1); fs('rgba(255,130,160,.4)'); ell(R * .62, R * .28, R * .16, R * .1); fs('rgba(255,130,160,.4)');
  if (R > 15) {
    ctx.beginPath();
    for (const sx of [-1, 1]) { ctx.moveTo(sx * R * .45, R * .28); ctx.lineTo(sx * R * 1.15, R * .18); ctx.moveTo(sx * R * .45, R * .36); ctx.lineTo(sx * R * 1.15, R * .42); }
    st(pal.whisk, Math.max(1, R * .04));
  }
}
/* sitzende Katze, Ursprung = Boden zwischen den Pfoten, ca. 170 hoch */
function sitCat(x, y, s, pal, o = {}) {
  const al = o.alpha == null ? 1 : o.alpha; if (al <= .01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); const sq = o.sq || 0;
  ctx.scale(s * (o.face || 1) * (1 + sq * .15), s * (1 - sq * .15)); ctx.globalAlpha = al;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const tw = Math.sin(TIME * 2.5 + (o.ph || 0));
  ctx.beginPath(); ctx.moveTo(24, -14); ctx.quadraticCurveTo(84, -16, 70 + tw * 6, -80 + tw * 8); st(pal.line, 20); st(pal.b, 13);
  if (pal.tabby) { ctx.save(); ctx.beginPath(); ctx.moveTo(24, -14); ctx.quadraticCurveTo(84, -16, 70 + tw * 6, -80 + tw * 8); ctx.setLineDash([6, 12]); st(pal.stripes, 13); ctx.restore(); }
  ell(0, -52, 44, 52); fs(pal.b);
  ctx.save(); ell(0, -52, 44, 52); ctx.clip(); ell(0, -82, 26, 40); fs(pal.bib);
  if (pal.tabby) { ctx.beginPath(); for (const sx of [-1, 1]) for (let i = 0; i < 3; i++) { const yy = -78 + i * 22; ctx.moveTo(sx * 46, yy); ctx.quadraticCurveTo(sx * 30, yy + 4, sx * 22, yy + 12); } st(pal.stripes, 6); }
  ctx.restore();
  ell(0, -52, 44, 52); st(pal.line, 4);
  ell(-17, -7, 14, 9); fs(pal.paw || pal.b); st(pal.line, 3.5);
  if (o.pawUp) { ell(32, -84, 11, 15, -.4); fs(pal.paw || pal.b); st(pal.line, 3.5); }
  else { ell(17, -7, 14, 9); fs(pal.paw || pal.b); st(pal.line, 3.5); }
  if (pal.bell) { ctx.beginPath(); ctx.ellipse(0, -90, 28, 9, 0, .1 * Math.PI, .9 * Math.PI); st('#3F86D6', 6); circ(0, -80, 7); fs('#F4C542'); st('#A8790B', 2.5); }
  ctx.save(); ctx.translate(0, -118); headFront(pal, 40, o); ctx.restore();
  ctx.restore();
}
function mkCat(x, y, pal, s = 1) { return { x, y, s, pal, face: 1, alpha: 1, sq: 0, rot: 0, anim: null, blinkT: 0, blinkCd: rnd(1, 4), pawUp: false, happy: false, lx: 0, ly: 0, jy: 0, ph: rnd(0, 6), net: false }; }
function hop(c, tx, ty, h, dur, cb, s1) {
  if (Math.abs(tx - c.x) > 2) c.face = tx > c.x ? 1 : -1;
  c.anim = { x0: c.x, y0: c.y, s0: c.s, s1: s1 == null ? c.s : s1, tx, ty, h, dur, t: 0, cb }; SFX.hop();
}
function updCat(c, dt) {
  c.blinkCd -= dt; c.blinkT -= dt; if (c.blinkCd < 0) { c.blinkT = .15; c.blinkCd = rnd(2, 5); }
  c.sq = Math.max(0, c.sq - dt * 4);
  const a = c.anim; if (!a) return;
  a.t += dt; const k = Math.min(1, a.t / a.dur);
  c.x = lerp(a.x0, a.tx, k); c.y = lerp(a.y0, a.ty, k) - Math.sin(Math.PI * k) * a.h; c.s = lerp(a.s0, a.s1, k);
  if (k >= 1) { c.anim = null; c.sq = 1; SFX.land(); if (a.cb) a.cb(); }
}
function drawCat(c) {
  sitCat(c.x, c.y - c.jy, c.s, c.pal, { face: c.face, alpha: c.alpha, sq: c.sq, rot: c.rot, blink: c.blinkT > 0, pawUp: c.pawUp, happy: c.happy, lx: c.lx, ly: c.ly, ph: c.ph });
  if (c.net) drawNet(c.x, c.y - c.jy - 75 * c.s, 92 * c.s, Math.sin(TIME * 3) * .1);
}
const pawOf = c => ({ x: c.x + 32 * c.s * c.face, y: c.y - c.jy - 84 * c.s });

/* ---------------- Rakete ---------------- */
/* Ursprung = Mitte, zeigt bei rot=0 nach oben; Flossen enden bei +122 */
function drawRocket(x, y, rot, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.fire) {
    const f = 1 + Math.sin(TIME * 40) * .12 + (o.big ? .6 : 0);
    ctx.beginPath(); ctx.moveTo(-28, 114); ctx.quadraticCurveTo(0, 114 + 150 * f, 28, 114); ctx.closePath(); fs('rgba(255,120,40,.92)');
    ctx.beginPath(); ctx.moveTo(-16, 114); ctx.quadraticCurveTo(0, 114 + 95 * f, 16, 114); ctx.closePath(); fs('#FFE27A');
  }
  poly([-44, 20, -92, 104, -88, 122, -44, 96]); fs('#E2483D'); st(OUT, 5);

        if (lt > 2.2 && !left) { left = true; next(); }
      }
    },
    draw() {
      marsSky(SY0);
      ctx.fillStyle = '#C4643C'; ctx.fillRect(-700, SY0, W + 1400, H + 700);
      ctx.fillStyle = '#B0552F'; ctx.fillRect(-700, SY0 + 140, W + 1400, 140);
      ctx.fillStyle = '#9C4727'; ctx.fillRect(-700, SY0 + 280, W + 1400, 400);
      [[120, 520, 18], [300, 640, 12], [900, 560, 20], [1080, 700, 14], [980, 830, 10], [200, 800, 16]].forEach(([x, y, r]) => { ell(x, y, r * 1.4, r); fs('#8A3D20'); });
      const g = ctx.createLinearGradient(0, SY0, 0, SH.bot); g.addColorStop(0, '#4A1E10'); g.addColorStop(1, '#22090A');
      rr(SH.x1, SY0 - 6, SH.x2 - SH.x1, SH.bot - SY0 + 6, 34); ctx.fillStyle = g; ctx.fill(); st('#7A3A20', 6);
      ell((SH.x1 + SH.x2) / 2, SY0, (SH.x2 - SH.x1) / 2 + 16, 14); fs('#7A3A20');
      ell(R.x, SY0, 100, 14); fs('rgba(90,30,10,.25)');
      drawRocket(R.x, R.y, 0, RS, { fire: R.fire, mitzi: R.cats >= 1, bell: R.cats >= 2, big: phase === 'launch' });
      drawCat(bell);
      if (phase === 'hook' || phase === 'pull') {
        const a = anchor(), e = phase === 'pull' ? bellPaw() : HK;
        chainLine(a.x, a.y, e.x, e.y);
        for (let i = 1; i <= 4; i++) { const k = i / 5; drawStar(lerp(a.x, e.x, k), lerp(a.y, e.y, k), 17, { glow: false, rot: i }); }
        drawStar(e.x, e.y, 30, { rot: Math.sin(TIME * 3) * .2 });
      }
      drawCat(mitzi);
    },
    down(p) {
      if (phase === 'hook') { if (dist(p.x, p.y, HK.x, HK.y) < 100) drag = true; }
      else if (phase === 'pull') { lastP = p; acc = 0; }
    },
    move(p) {
      if (phase === 'hook' && drag) {
        let x = p.x, y = clamp(p.y, 120, SH.bot - 30);
        if (y > SY0 + 10) x = clamp(x, SH.x1 + 24, SH.x2 - 24);
        const a = anchor(), d = dist(a.x, a.y, x, y); if (d > 640) { x = a.x + (x - a.x) * 640 / d; y = a.y + (y - a.y) * 640 / d; }
        HK.x = x; HK.y = y;
        const b = bellPaw();
        if (dist(HK.x, HK.y, b.x, b.y) < 80) {
          drag = false; phase = 'pull'; SFX.clink(); stars(b.x, b.y, 10); SFX.bellMeow(); bell.happy = true; after(.6, () => { bell.happy = false; });
          say('pull', null, true); setHint({ type: 'swipe', x1: 900, y1: 760, x2: 900, y2: 440 });
        }
      } else if (phase === 'pull' && lastP) {
        acc += Math.max(0, lastP.y - p.y); lastP = p;
        while (acc >= 85) { acc -= 85; pull(); }
      }
    },
    up() { drag = false; lastP = null; },
    get dbg() { return { H: HK, phase, bell, target, b: bellPaw() }; },
  };
};

/* ---------- Wieder zu Hause ---------- */
SCENES.end = () => {
  const GY = 770, RS = 1.1, RG = GY - 122 * RS;
  const R = { x: 1010, y: -400, fire: true, cats: true };
  const mitzi = mkCat(1010, GY, MITZI), bell = mkCat(1010, GY, BELL); mitzi.alpha = bell.alpha = 0;
  const SKY = [[300, 260], [450, 190], [600, 160], [750, 190], [900, 260]];
  let lt = 0, phase = 'land', btns = false;
  const bA = { x: 520, y: 470 }, bB = { x: 680, y: 470 };
  return {
    init() { clearSave(); },
    update(dt) {
      updCat(mitzi, dt); updCat(bell, dt);
      if (phase === 'land') {
        lt += dt; const k = Math.min(1, lt / 2.6); R.y = lerp(-400, RG, 1 - Math.pow(1 - k, 3));
        if (k >= 1) {
          phase = 'home'; R.fire = false; SFX.land();
          burst(R.x, GY, 14, ['#DDD', '#BBB', '#EEE'], { type: 'smoke', sp: 200, up: 40, g: -10, r0: 14, r1: 26, life: 1.2 });
          const w = winOf(R.x, R.y, 0, RS);
          after(.5, () => { R.cats = false; mitzi.alpha = 1; mitzi.x = w.x; mitzi.y = w.y + 45; mitzi.s = .4; hop(mitzi, 420, GY, 160, .8, null, 1); });
          after(.9, () => { bell.alpha = 1; bell.x = w.x; bell.y = w.y + 45; bell.s = .4; hop(bell, 580, GY, 160, .8, () => { bell.face = -1; }, .95); });
          after(1.9, () => { mitzi.happy = bell.happy = true; hearts(500, GY - 200, 12); SFX.fanfare(); say('end', null, true); });
          after(3.5, () => { btns = true; mitzi.happy = bell.happy = false; });
        }
      }
    },
    draw() {
      gardenBg(GY);
      for (let i = 0; i < SKY.length; i++) { const [x, y] = SKY[i]; drawStar(x, y, 30 + Math.sin(TIME * 3 + i) * 3, { rot: Math.sin(TIME * 2 + i) * .15 }); }
      rr(R.x - 120, GY - 14, 240, 26, 8); fs('#7A8492'); st(OUT, 4);
      drawRocket(R.x, R.y, 0, RS, { fire: R.fire, mitzi: R.cats, bell: R.cats, big: R.fire });
      drawCat(mitzi); drawCat(bell);
      if (btns) {
        playBtn(bA.x, bA.y, 1 + Math.sin(TIME * 4) * .04);
        circ(bB.x, bB.y, 72); fs('rgba(255,255,255,.9)'); st(OUT, 6);
        [[-18, -18], [18, -18], [-18, 18], [18, 18]].forEach(([dx, dy], i) => { rr(bB.x + dx - 14, bB.y + dy - 14, 28, 28, 7); fs(['#5BBF4A', '#3F86D6', '#E0533A', '#F5C04A'][i]); });
      }
    },
    down(p) {
      if (btns && dist(p.x, p.y, bA.x, bA.y) < 85) { SFX.pop(); goto(1); return; }
      if (btns && dist(p.x, p.y, bB.x, bB.y) < 85) { SFX.pop(); location.href = '../'; return; }
      for (const c of [mitzi, bell]) if (c.alpha > .5 && dist(p.x, p.y, c.x, c.y - 90) < 110) { (c === bell ? SFX.bellMeow : SFX.meow)(); c.sq = 1; hearts(c.x, c.y - 200, 6); return; }
      if (p.y < GY - 100) { burst(p.x, p.y, 18, ['#FFD54A', '#FF6FB0', '#7DDB5A', '#6FC3FF', '#fff'], { type: 'star', sp: 380, up: 60, g: 220, r0: 6, r1: 11 }); SFX.twinkle(); }
    },
  };
};

/* ---------- App-Symbol (nur zum Erzeugen der Bilder) ---------- */
SCENES.icon = () => ({
  hud: false,
  draw() {
    spaceBg(0); drawMars(980, 900, 330);
    drawStar(250, 180, 50, {}); drawStar(980, 230, 40, {}); drawStar(200, 760, 34, {});
    drawRocket(600, 470, .45, 2.3, { fire: true, mitzi: true });
  },
});

/* ---------------- Ablauf ---------------- */
const FLOW = [
  { s: 'title' },
  { s: 'intro' },
  { s: 'flight', dir: 'out' },
  { s: 'chain' },
  { s: 'alien' },
  { s: 'rescue' },
  { s: 'flight', dir: 'back' },
  { s: 'end' },
];
let scene = null, flowIdx = 0, PAUSE = false;
const fade = { a: 0, dir: 0, cb: null };
function startScene(idx) {
  voiceStop(); flowIdx = idx; TIMERS = []; PARTS = []; HINT = null;
  const f = FLOW[idx]; scene = SCENES[f.s](f);
  if (idx >= 2 && f.s !== 'end' && f.s !== 'icon') saveGame(idx);
  if (scene.init) scene.init();
}
function goto(idx) { if (fade.dir) return; fade.dir = 1; fade.cb = () => { startScene(idx); fade.dir = -1; }; }
function next() { goto(flowIdx + 1); }
function updFade(dt) {
  if (fade.dir === 1) { fade.a += dt * 3; if (fade.a >= 1) { fade.a = 1; const cb = fade.cb; fade.cb = null; cb && cb(); } }
  else if (fade.dir === -1) { fade.a -= dt * 2.5; if (fade.a <= 0) { fade.a = 0; fade.dir = 0; } }
}

/* ---------------- HUD, Pause ---------------- */
const MAMA = { x: 1146, y: 54 };
function drawHUD() {
  circ(54, 54, 34); fs('rgba(255,255,255,.75)'); st(OUT, 3);
  poly([34, 58, 54, 38, 74, 58]); fs(OUT); rr(40, 56, 28, 18, 2); fs(OUT);
  const k = VOICE.speaking ? 1 + Math.sin(TIME * 10) * .06 : 1;
  ctx.save(); ctx.translate(MAMA.x, MAMA.y); ctx.scale(k, k);
  circ(0, 0, 38); fs('#FF7FA8'); st('#fff', 4); heartPath(0, 6, 34); fs('#fff');
  if (VOICE.speaking) for (let i = 0; i < 2; i++) { ctx.beginPath(); ctx.arc(0, 0, 50 + i * 14 + (TIME * 30 % 14), Math.PI * .78, Math.PI * 1.22); st(`rgba(255,255,255,${.7 - i * .3})`, 4); }
  ctx.restore();
}
function drawPause() {
  ctx.fillStyle = 'rgba(10,10,30,.65)'; ctx.fillRect(-700, -700, W + 1400, H + 1400);
  circ(600, 400, 100); fs('#5BBF4A'); st('#fff', 7); poly([570, 355, 570, 445, 645, 400]); fs('#fff');
  circ(600, 650, 56); fs('#F29E38'); st('#fff', 5); poly([570, 656, 600, 626, 630, 656]); fs('#fff'); rr(580, 652, 40, 26, 3); fs('#fff');
  text('Weiterspielen', 600, 540, 34, '#fff'); text('Zum Menü', 600, 740, 26, '#fff');
}
function pauseDown(p) { PAUSE = false; if (dist(p.x, p.y, 600, 650) < 75) goto(0); }

/* ---------------- Eingabe (mehrere Finger) ---------------- */
const DOWN = new Set();
const toV = e => ({ x: (e.clientX - OX) / S, y: (e.clientY - OY) / S });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit(); voiceUnlock(); idle = 0;
  if (fade.dir) return;
  const p = toV(e);
  if (PAUSE) { pauseDown(p); return; }
  if (scene.hud !== false && dist(p.x, p.y, 54, 54) < 46) { PAUSE = true; SFX.pop(); return; }
  if (scene.hud !== false && dist(p.x, p.y, MAMA.x, MAMA.y) < 50) { SFX.pop(); if (VOICE.last) say(VOICE.last); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  DOWN.add(e.pointerId);
  if (scene.down) scene.down(p, e.pointerId);
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (!DOWN.has(e.pointerId) || PAUSE || fade.dir) return;
  e.preventDefault(); idle = 0; if (scene.move) scene.move(toV(e), e.pointerId);
}, { passive: false });
const endPtr = e => { if (!DOWN.has(e.pointerId)) return; DOWN.delete(e.pointerId); if (!PAUSE && scene.up) scene.up(toV(e), e.pointerId); };
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
['touchmove', 'gesturestart', 'contextmenu', 'dblclick'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* ---------------- Hauptschleife ---------------- */
let last = performance.now();
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0A0D2B'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
  scene.draw();
  drawParts();
  if (scene.hud !== false) drawHUD();
  if (!fade.dir && !PAUSE) drawHint();
  if (PAUSE) drawPause();
  if (fade.a > 0) { ctx.fillStyle = `rgba(10,10,30,${fade.a})`; ctx.fillRect(-2000, -2000, W + 4000, H + 4000); }
  if (VH > VW * 1.1) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = 'rgba(10,10,30,.9)'; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(VW / 2, VH / 2 - 40); ctx.rotate(Math.sin(TIME * 2) * .6 - .6); rr(-50, -75, 100, 150, 14); st('#fff', 6); ctx.restore();
    text('Bitte das Tablet quer halten', VW / 2, VH / 2 + 90, 26, '#fff');
  }
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TIME += dt; idle += dt;
  try {
    if (!PAUSE) {
      updTimers(dt); if (scene.update) scene.update(dt); updParts(dt);
      if (!fade.dir && HINT && VOICE.last && !VOICE.speaking && idle > 16 && VOICE.rep < 2) { VOICE.rep++; idle = 0; say(VOICE.last); }
    }
    updFade(dt); render();
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
FLOW.push({ s: 'icon' });
startScene(location.hash === '#icon' ? FLOW.length - 1 : 0);
FLOW.pop();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__M = { get idx() { return flowIdx; }, get hint() { return HINT; }, get scene() { return scene; }, get fading() { return fade.dir; }, get voice() { return VOICE; }, FLOW, go: i => startScene(i) };
</script>
